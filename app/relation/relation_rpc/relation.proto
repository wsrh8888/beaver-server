syntax = "proto3"; //指定proto版本

package relation_rpc;

option go_package = "./pb";

message GetFriendIdsRequest {
  string UserID = 1;
}

message GetFriendIdsResponse {
  repeated string friend_ids = 1;
}

// 通过ID获取好友列表
message GetFriendsListByIdsReq {
  repeated string ids = 1; // 唯一ID列表
  int64 since = 2; // 时间戳，从此时间戳之后获取变更的记录
}

message FriendListById {
  string id = 1; // 唯一ID
  string sendUserId = 2; // 发送者用户ID
  string revUserId = 3; // 接收者用户ID
  string sendUserNotice = 4; // 发送者备注
  string revUserNotice = 5; // 接收者备注
  string source = 6; // 添加好友来源
  bool isDeleted = 7; // 是否已删除
  int64 version = 8; // 版本号
  int64 createdAt = 9; // 创建时间
  int64 updatedAt = 10; // 更新时间
}

message GetFriendsListByIdsRes {
  repeated FriendListById friends = 1; // 好友列表
}

// 获取用户好友版本信息
message GetFriendVersionsReq {
  string userId = 1; // 用户ID
  int64 since = 2; // 从这个版本号之后开始同步
}

message GetFriendVersionsRes {
  message FriendVersion {
    string friendId = 1;

    int64 version = 2; // 版本号
  }
  repeated FriendVersion friendVersions = 1; // 好友版本列表
}

// 获取用户好友验证版本信息
message GetFriendVerifyVersionsReq {
  string userId = 1; // 用户ID
  int64 since = 2; // 从这个版本号之后开始同步
}

message GetFriendVerifyVersionsRes {
  message FriendVerifyVersion {
    string verify_id = 1; // 验证记录ID
    int64 version = 2; // 版本号
  }
  repeated FriendVerifyVersion friendVerifyVersions = 1; // 好友验证版本列表
}

// 通过ID获取好友验证列表
message GetFriendVerifiesListByIdsReq {
  repeated string verify_ids = 1; // 验证记录ID列表
  int64 since = 2; // 时间戳，从此时间戳之后获取变更的记录
}

message FriendVerifyListById {
  string verify_id = 1; // 验证记录ID
  string sendUserId = 2; // 发送者用户ID
  string revUserId = 3; // 接收者用户ID
  int32 sendStatus = 4; // 发送方状态：0(未处理)/1(已通过)/2(已拒绝)/3(忽略)/4(删除)
  int32 revStatus = 5; // 接收方状态：0(未处理)/1(已通过)/2(已拒绝)/3(忽略)/4(删除)
  string message = 6; // 附加消息
  string source = 7; // 添加好友来源
  int64 version = 8; // 版本号
  int64 createdAt = 9; // 创建时间
  int64 updatedAt = 10; // 更新时间
}

message GetFriendVerifiesListByIdsRes {
  repeated FriendVerifyListById friendVerifies = 1; // 好友验证列表
}

// 获取好友详细信息（包含用户基础信息和好友关系信息）
message GetFriendDetailReq {
  string userId = 1; // 当前用户ID
  repeated string friendIds = 2; // 好友ID列表
}

message FriendDetailItem {
  string userId = 1; // 用户ID
  string nickName = 2; // 用户昵称
  string avatar = 3; // 用户头像
  string notice = 4; // 好友备注
  int64 friendAt = 5; // 成为好友的时间
}

message GetFriendDetailRes {
  repeated FriendDetailItem friends = 1; // 好友详细信息列表
}

message IsFriendReq {
  string user_a = 1;
  string user_b = 2;
}

message IsFriendRes {
  bool is_friend = 1;
}

message IsBlockedReq {
  string user_a = 1;
  string user_b = 2;
}

message IsBlockedRes {
  bool is_blocked = 1; // 任一方拉黑对方
}

// ==================== 好友关系管理（通用）====================

message FriendItem {
  string friend_id = 1; // string 好友关系 ID
  string send_user_id = 2; // string 发起方用户 ID
  string rev_user_id = 3; // string 接收方用户 ID
  string send_user_notice = 4; // string 发起方备注
  string rev_user_notice = 5; // string 接收方备注
  string source = 6; // string 来源
  bool is_deleted = 7; // bool 是否已删除
  string created_at = 8; // string 创建时间 RFC3339
  string updated_at = 9; // string 更新时间 RFC3339
}

// ListFriends：好友关系查询（列表 + relation_id 精确查详情）
message ListFriendsReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  string user_id = 3; // string 参与方用户 ID 筛选，可选
  string peer_user_id = 4; // string 对方用户 ID 筛选，可选
  optional bool is_deleted = 5; // bool 删除状态筛选，可选
  string start_time = 6; // string 开始时间，可选
  string end_time = 7; // string 结束时间，可选
  string relation_id = 8; // string 好友关系记录 ID 精确查，可选
}

message ListFriendsRes {
  int64 total = 1; // int64 总数
  repeated FriendItem list = 2; // array 好友列表
}

// UpdateFriends：好友关系状态变更（物理删除 / 恢复软删，支持批量）
message UpdateFriendsReq {
  repeated string relation_ids = 1; // array 好友关系记录 ID
  int32 action = 2; // int32 操作：1=物理删除 2=恢复软删
}

message UpdateFriendsRes {
  int64 affected_count = 1; // int64 影响条数
}

message FriendVerifyItem {
  string verify_id = 1; // string 验证记录 ID
  string send_user_id = 2; // string 发起方用户 ID
  string rev_user_id = 3; // string 接收方用户 ID
  int32 send_status = 4; // int32 发起方状态
  int32 rev_status = 5; // int32 接收方状态
  string message = 6; // string 附加消息
  string source = 7; // string 来源
  string created_at = 8; // string 创建时间 RFC3339
  string updated_at = 9; // string 更新时间 RFC3339
}

// ListFriendVerifies：好友验证查询（列表 + verify_id 精确查详情）
message ListFriendVerifiesReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  string send_user_id = 3; // string 发起方筛选，可选
  string rev_user_id = 4; // string 接收方筛选，可选
  int32 send_status = 5; // int32 发起方状态，0 表示全部
  int32 rev_status = 6; // int32 接收方状态，0 表示全部
  string start_time = 7; // string 开始时间，可选
  string end_time = 8; // string 结束时间，可选
  string verify_id = 9; // string 验证记录 ID 精确查，可选
}

message ListFriendVerifiesRes {
  int64 total = 1; // int64 总数
  repeated FriendVerifyItem list = 2; // array 验证列表
}

// UpdateFriendVerifies：好友验证记录删除（支持批量）
message UpdateFriendVerifiesReq {
  repeated string verify_ids = 1; // array 验证记录 ID
  int32 action = 2; // int32 操作：1=删除
}

message UpdateFriendVerifiesRes {
  int64 affected_count = 1; // int64 影响条数
}

// ==================== 好友黑名单（通用）====================

message FriendBlockItem {
  string block_id = 1; // string 黑名单记录 ID
  string user_id = 2; // string 执行拉黑的用户 ID
  string blocked_user_id = 3; // string 被拉黑的用户 ID
  string created_at = 4; // string 创建时间 RFC3339
}

// ListFriendBlocks：黑名单查询（列表 + block_id 精确查详情）
message ListFriendBlocksReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  string user_id = 3; // string 拉黑方用户 ID 筛选，可选
  string blocked_user_id = 4; // string 被拉黑用户 ID 筛选，可选
  string block_id = 5; // string 记录 ID 精确查，可选
}

message ListFriendBlocksRes {
  int64 total = 1; // int64 总数
  repeated FriendBlockItem list = 2; // array 黑名单列表
}

// UpdateFriendBlocks：黑名单变更（解除拉黑 / 删除记录，支持批量）
message UpdateFriendBlocksReq {
  repeated string block_ids = 1; // array 黑名单记录 ID
  int32 action = 2; // int32 操作：1=解除拉黑（删除记录）
}

message UpdateFriendBlocksRes {
  int64 affected_count = 1; // int64 影响条数
}


message GetGroupMembersReq {
  string groupID = 1; // 群组Id
}

message GroupMemberInfo {
  string userID = 1;  // 用户Id
  string username = 2; // 用户名
  string avatar = 3;   // 用户头像
}

message GetGroupMembersRes {
  repeated GroupMemberInfo members = 1; // 成员信息列表
}

// 获取用户群组中的其他成员ID列表
message GetUserGroupMembersReq {
  string userID = 1; // 用户ID
}

message GetUserGroupMembersRes {
  repeated string memberIDs = 1; // 群成员ID列表（去重后的所有群友）
}

// 获取用户加入的群组ID列表
message GetUserGroupIDsReq {
  string userID = 1; // 用户ID
}

message GetUserGroupIDsRes {
  repeated string groupIDs = 1; // 用户加入的群组ID列表
}

// 通过ID获取群组列表
message GetGroupsListByIdsReq {
  repeated string groupIDs = 1; // 群组ID列表
  int64 since = 2; // 时间戳，从此时间戳之后获取变更的记录
}

message GroupListById {
  string groupID = 1; // 群组ID
  string name = 2; // 群组名称
  string avatar = 3; // 群组头像
  string description = 4; // 群组描述
  int64 version = 5; // 版本号
  int64 createdAt = 6; // 创建时间
  int64 updatedAt = 7; // 更新时间
}

message GetGroupsListByIdsRes {
  repeated GroupListById groups = 1; // 群组列表
}

// 通过ID获取群成员列表
message GetGroupMembersListByIdsReq {
  repeated string groupIDs = 1; // 群组ID列表
  int64 since = 2; // 时间戳，从此时间戳之后获取变更的记录
}

message GroupMemberListById {
  string groupID = 1; // 群组ID
  string userID = 2; // 用户ID
  int32 role = 3; // 成员角色 (1: 群主, 2: 管理员, 3: 普通成员)
  int64 joinedAt = 4; // 加入时间
  int64 version = 5; // 版本号
}

message GetGroupMembersListByIdsRes {
  repeated GroupMemberListById members = 1; // 群成员列表
}

// 通过ID获取入群申请列表
message GetGroupJoinRequestsListByIdsReq {
  repeated string groupIDs = 1; // 群组ID列表
  int64 since = 2; // 时间戳，从此时间戳之后获取变更的记录
}

message GroupJoinRequestListById {
  string requestID = 1; // 申请ID
  string groupID = 2; // 群组ID
  string userID = 3; // 申请用户ID
  string message = 4; // 申请消息
  int32 status = 5; // 申请状态 (0: 待审核, 1: 已通过, 2: 已拒绝)
  int64 appliedAt = 6; // 申请时间
  int64 version = 7; // 版本号
}

message GetGroupJoinRequestsListByIdsRes {
  repeated GroupJoinRequestListById requests = 1; // 入群申请列表
}

// 获取用户的群组申请（包括发出的申请和管理的申请）
message GetUserGroupRequestVersionsReq {
  string userID = 1; // 用户ID
  int64 since = 2; // 时间戳，从此时间戳之后获取变更的记录
}

message GetUserGroupRequestVersionsRes {
  repeated GroupRequestVersionItem versions = 1; // 版本列表
}

message GroupRequestVersionItem {
  string groupID = 1; // 群组ID
  int64 version = 2; // 最新版本号
}

message CanSendGroupMessageReq {
  string group_id = 1;
  string user_id = 2;
}

message CanSendGroupMessageRes {
  bool allowed = 1;
  string reason = 2;
}

// 添加群成员（供开放平台 Digital 入群等内部调用）
message AddGroupMemberReq {
  string group_id = 1; // string 群组 ID
  string user_id = 2; // string 要加入的用户 ID
  string operated_by = 3; // string 操作者 ID（如 oauth_id），可为空
}

message AddGroupMemberRes {
  bool added = 1; // bool 是否新加入（已在群内则为 false）
  int64 member_version = 2; // int64 群成员列表版本号
}

// 移除群成员
message RemoveGroupMemberReq {
  string group_id = 1; // string 群组 ID
  string user_id = 2; // string 要移除的用户 ID
  string operated_by = 3; // string 操作者 ID（如 oauth_id），可为空
  bool kick = 4; // bool true=被踢(status=3)，false=退出(status=2)
}

message RemoveGroupMemberRes {
  int64 member_version = 1; // int64 群成员列表版本号
}

// ==================== 群组管理（通用）====================

message GroupItem {
  uint64 id = 1; // uint64 记录 ID
  string group_id = 2; // string 群组 ID
  int32 type = 3; // int32 群类型
  string title = 4; // string 群名称
  string avatar = 5; // string 群头像
  string creator_id = 6; // string 创建者 ID
  string notice = 7; // string 群公告
  int32 status = 8; // int32 群状态
  bool mute_all = 9; // bool 是否全员禁言
  string created_at = 10; // string 创建时间 RFC3339
  string updated_at = 11; // string 更新时间 RFC3339
}

message ListGroupsReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  int32 status = 3; // int32 状态筛选，0 表示全部
  int32 type = 4; // int32 类型筛选，0 表示全部
  string keywords = 5; // string 群名关键词，可选
  uint64 id = 6; // uint64 记录 ID，可选
  string group_id = 7; // string 业务群组 ID，可选
}

message ListGroupsRes {
  int64 total = 1; // int64 总数
  repeated GroupItem list = 2; // array 群组列表
}

message UpdateGroupReq {
  uint64 id = 1; // uint64 记录 ID
  string title = 2; // string 群名称，空表示不修改
  string avatar = 3; // string 群头像，空表示不修改
  string notice = 4; // string 群公告，空表示不修改
  int32 status = 5; // int32 群状态，0 表示不修改
  optional bool mute_all = 6; // bool 全员禁言，可选
}

message UpdateGroupRes {}

message GroupMemberItem {
  uint64 id = 1; // uint64 记录 ID
  string group_id = 2; // string 群组 ID
  string user_id = 3; // string 用户 ID
  int32 role = 4; // int32 成员角色
  int32 status = 5; // int32 成员状态
  int32 prohibition_minutes = 6; // int32 禁言剩余分钟，0 表示未禁言
  string created_at = 7; // string 创建时间 RFC3339
  string updated_at = 8; // string 更新时间 RFC3339
}

message ListGroupMembersReq {
  string group_id = 1; // string 群组 ID
  int32 page = 2; // int32 页码
  int32 page_size = 3; // int32 每页条数
  int32 role = 4; // int32 角色筛选，0 表示全部
  int32 status = 5; // int32 状态筛选，0 表示全部
}

message ListGroupMembersRes {
  int64 total = 1; // int64 总数
  repeated GroupMemberItem list = 2; // array 成员列表
}

message UpdateGroupMemberReq {
  uint64 id = 1; // uint64 成员记录 ID
  optional int32 role = 2; // int32 角色，可选
  optional int32 mute_minutes = 3; // int32 禁言分钟，0 解除，可选
}

message UpdateGroupMemberRes {}


service friend {
  rpc GetFriendIds(GetFriendIdsRequest) returns (GetFriendIdsResponse);
  rpc GetFriendVersions(GetFriendVersionsReq) returns (GetFriendVersionsRes); //获取用户好友版本信息
  rpc GetFriendVerifyVersions(GetFriendVerifyVersionsReq) returns (GetFriendVerifyVersionsRes); //获取用户好友验证版本信息
  rpc GetFriendsListByIds(GetFriendsListByIdsReq) returns (GetFriendsListByIdsRes); //通过ID获取好友列表
  rpc GetFriendVerifiesListByIds(GetFriendVerifiesListByIdsReq) returns (GetFriendVerifiesListByIdsRes); //通过ID获取好友验证列表
  rpc GetFriendDetail(GetFriendDetailReq) returns (GetFriendDetailRes); //获取好友详细信息
  rpc IsFriend(IsFriendReq) returns (IsFriendRes);
  rpc IsBlocked(IsBlockedReq) returns (IsBlockedRes);

  // 管理类通用能力（admin / 其他服务均可复用，不与 HTTP 接口 1:1）
  rpc ListFriends(ListFriendsReq) returns (ListFriendsRes); // 好友关系查询：列表、详情
  rpc UpdateFriends(UpdateFriendsReq) returns (UpdateFriendsRes); // 好友关系变更：物理删除、恢复
  rpc ListFriendVerifies(ListFriendVerifiesReq) returns (ListFriendVerifiesRes); // 好友验证查询：列表、详情
  rpc UpdateFriendVerifies(UpdateFriendVerifiesReq) returns (UpdateFriendVerifiesRes); // 好友验证删除
  rpc ListFriendBlocks(ListFriendBlocksReq) returns (ListFriendBlocksRes); // 黑名单查询：列表、详情
  rpc UpdateFriendBlocks(UpdateFriendBlocksReq) returns (UpdateFriendBlocksRes); // 黑名单变更：解除拉黑
}


service group {
  rpc GetGroupMembers(GetGroupMembersReq) returns (GetGroupMembersRes); // 获取群成员列表
  rpc GetUserGroupMembers(GetUserGroupMembersReq) returns (GetUserGroupMembersRes); // 获取用户群组中的其他成员ID列表
  rpc GetUserGroupIDs(GetUserGroupIDsReq) returns (GetUserGroupIDsRes); // 获取用户加入的群组ID列表
  rpc GetGroupsListByIds(GetGroupsListByIdsReq) returns (GetGroupsListByIdsRes); // 通过ID获取群组列表
  rpc GetGroupMembersListByIds(GetGroupMembersListByIdsReq) returns (GetGroupMembersListByIdsRes); // 通过ID获取群成员列表
  rpc GetGroupJoinRequestsListByIds(GetGroupJoinRequestsListByIdsReq) returns (GetGroupJoinRequestsListByIdsRes); // 通过ID获取入群申请列表
  rpc GetUserGroupRequestVersions(GetUserGroupRequestVersionsReq) returns (GetUserGroupRequestVersionsRes); // 获取用户群组申请版本信息
  rpc CanSendGroupMessage(CanSendGroupMessageReq) returns (CanSendGroupMessageRes); // 校验用户是否可在群内发消息
  rpc AddGroupMember(AddGroupMemberReq) returns (AddGroupMemberRes); // 添加群成员
  rpc RemoveGroupMember(RemoveGroupMemberReq) returns (RemoveGroupMemberRes); // 移除群成员

  rpc ListGroups(ListGroupsReq) returns (ListGroupsRes);
  rpc UpdateGroup(UpdateGroupReq) returns (UpdateGroupRes);
  rpc ListGroupMembers(ListGroupMembersReq) returns (ListGroupMembersRes);
  rpc UpdateGroupMember(UpdateGroupMemberReq) returns (UpdateGroupMemberRes);
}

