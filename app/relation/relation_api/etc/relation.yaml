# RemoteProxy 唯一出站注册表：本仓出站到其它团队走各自标准 HTTP 契约 + 机器票 Bearer；
# 外仓打 A 主体（Beaver）统一走 gateway_api 的 /beaver/api/... 标准契约，业务能力只有这一套 HTTP 契约；
# 本仓出站不使用任何 /internal/* 私有端点，只走对端标准 .api 路径。
RemoteProxy:
  Open:
    BaseURL: http://127.0.0.1:21900
    Auth: client_credentials
    ClientID: beaver-server
    ClientSecret: s2s-dev-secret
Name: relation
Host: 0.0.0.0
Port: 20200
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_relation?charset=utf8mb4&parseTime=True&loc=Local
Redis:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
Log:
  Mode: file
  Path: logs/relation_api
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  KeepDays: 7
  Stat: false
# go-zero 自带：在独立端口暴露 /metrics（业务口 20200 + 7000）
Prometheus:
  Host: 0.0.0.0
  Port: 27200
  Path: /metrics
Etcd: 127.0.0.1:2379
Domain: http://192.168.3.4:20800
UserRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
# relation_rpc：friend + group 同进程（etcd relationrpc.rpc）
RelationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
ChatRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: messagerpc.rpc
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
RocketMQ:
  Addr: 127.0.0.1:9876

# 用户 JWT 签名密钥：本服务独立签发并校验用户票，不信任外部塞的 Beaver-User-Id。
Auth:
  AccessSecret: f81d1b2d8f69a503d848a2ad0b9908186bc435d36cf5a885c33491b51613240f38ff672700d60ffdf19466cc9a687620
  AccessExpire: 3600
# 入站 S2S 机器票：本团队业务面共用一套凭据，票据受众统一 core:api。
# 换票端点：POST /beaver/api/account/auth_token/v1/issue（client_credentials）。
S2S:
  Secret: s2s-dev-secret
  Clients:
    beaver-backend:
      ClientID: beaver-backend
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-open:
      ClientID: beaver-open
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-social:
      ClientID: beaver-social
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-call:
      ClientID: beaver-call
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true

