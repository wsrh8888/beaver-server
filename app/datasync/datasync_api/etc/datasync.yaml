Name: datasync_api
Host: 0.0.0.0
Port: 21700
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_datasync?charset=utf8mb4&parseTime=True&loc=Local
Redis:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
Etcd: 127.0.0.1:2379
# 入站 S2S 机器票：本团队业务面共用一套凭据，票据受众统一 core:api。
S2S:
  Secret: beaver-s2s-01-core
Auth:
  AccessSecret: f81d1b2d8f69a503d848a2ad0b9908186bc435d36cf5a885c33491b51613240f38ff672700d60ffdf19466cc9a687620
  AccessExpire: 3600
FriendRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
  Timeout: 10000 # 10秒超时，单位毫秒
GroupRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
  Timeout: 10000 # 10秒超时，单位毫秒
UserRpc:
  NonBlock: true
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: accountrpc.rpc
  Timeout: 10000 # 10秒超时，单位毫秒
ChatRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: messagerpc.rpc
  Timeout: 10000 # 10秒超时，单位毫秒
EmojiRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: assetrpc.rpc
  Timeout: 10000 # 10秒超时，单位毫秒
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
  Timeout: 10000 # 10秒超时，单位毫秒
# 出站 S2S 端点注册表：只登记其它团队（circle / agent）的入口。
# 本面只做 getSync* 增量同步，不承接 A 主体业务能力，也不提供业务门面。
RemoteProxy:
  Agent:
    BaseURL: http://127.0.0.1:22300
    Auth: internal_token
    InternalToken: ""
  # S2S 出站：社交服务（beaver-social），client_credentials 换票后调其同步接口。
  # BaseURL 指向社交服务的标准 .api 地址，须与该服务自身的 S2S Secret/Clients 配置成对。
  Social:
    BaseURL: http://127.0.0.1:22100
    ClientID: beaver-server
    ClientSecret: beaver-s2s-03-social-server
