syntax = "proto3";

package doc_rpc;

option go_package = "./doc_rpc";

// ==================== 文档空间（space）====================
// 在线文档权威源的顶层容器。单租户：无 org_id / product_scope。

message SpaceItem {
  uint64 id = 1; // uint64 记录 ID
  string space_id = 2; // string 空间业务ID
  string name = 3; // string 空间名
  string kind = 4; // string owner个人 team团队 im会话内嵌
  string owner_user_id = 5; // string 归属用户
  string parent_id = 6; // string 父空间ID，空为根
  string icon = 7; // string 图标标识
  string description = 8; // string 描述
  int32 status = 9; // int32 1启用 2停用
  int32 sort = 10; // int32 排序
  string created_at = 11; // string RFC3339
}

message CreateSpaceReq {
  string name = 1; // string
  string kind = 2; // string 默认 owner
  string owner_user_id = 3; // string 请求者（鉴权后注入）
  string parent_id = 4; // string 可空
  string icon = 5; // string
  string description = 6; // string
  int32 sort = 7; // int32
}
message CreateSpaceRes {
  string space_id = 1; // string
}

message UpdateSpaceReq {
  string space_id = 1; // string
  string name = 2; // string
  string icon = 3; // string
  string description = 4; // string
  string parent_id = 5; // string 移动
  int32 status = 6; // int32
  int32 sort = 7; // int32
}
message UpdateSpaceRes {}

message DeleteSpaceReq {
  string space_id = 1; // string 级联软删其下节点/文档
  string operator_user_id = 2; // string
}
message DeleteSpaceRes {}

message GetSpaceReq {
  string space_id = 1; // string
  string user_id = 2; // string 鉴权主体
}
message GetSpaceRes {
  SpaceItem space = 1; // 空间详情
}

message ListSpacesReq {
  string user_id = 1; // string 仅返回该用户可见（owner 或被授权）的空间
  int32 status = 2; // int32 0全部
  int32 page = 3; // int32
  int32 page_size = 4; // int32
}
message ListSpacesRes {
  int64 total = 1; // int64
  repeated SpaceItem spaces = 2; // array
}

// ==================== 节点树（node：page|folder）====================

message NodeItem {
  uint64 id = 1; // uint64
  string node_id = 2; // string 节点业务ID
  string space_id = 3; // string 所属空间
  string parent_id = 4; // string 父节点，空为空间根
  string title = 5; // string 标题
  string icon = 6; // string
  string type = 7; // string page|folder
  int32 sort = 8; // int32
  string doc_id = 9; // string type=page 时关联文档，folder 为空
}

message CreateNodeReq {
  string space_id = 1; // string
  string parent_id = 2; // string 空为根
  string title = 3; // string
  string type = 4; // string page|folder，默认 page
  string icon = 5; // string
  int32 sort = 6; // int32
  string operator_user_id = 7; // string
}
message CreateNodeRes {
  string node_id = 1; // string
  string doc_id = 2; // string type=page 时新建文档的ID
}

message UpdateNodeReq {
  string node_id = 1; // string
  string title = 2; // string
  string icon = 3; // string
  string parent_id = 4; // string 移动
  int32 sort = 5; // int32
  string operator_user_id = 6; // string
}
message UpdateNodeRes {}

message DeleteNodeReq {
  string node_id = 1; // string folder 递归删除子节点
  string operator_user_id = 2; // string
}
message DeleteNodeRes {}

message ListNodesReq {
  string space_id = 1; // string
  string user_id = 2; // string 鉴权主体
}
message ListNodesRes {
  repeated NodeItem nodes = 1; // array 扁平返回，客户端按 parent_id 组装树
}

// ==================== 文档（document，权威正文）====================

message DocItem {
  uint64 id = 1; // uint64
  string doc_id = 2; // string 文档业务ID
  string node_id = 3; // string
  string space_id = 4; // string
  string title = 5; // string
  string content_json = 6; // string block 结构化快照 JSON
  int32 version = 7; // int32 单调递增
  string owner_user_id = 8; // string
  string last_edited_by = 9; // string
  int32 status = 11; // int32 1启用 2停用
  string updated_at = 12; // string RFC3339
  string created_at = 13; // string RFC3339
  int32 epoch = 14; // int32 协同房间纪元，回滚时递增
  string doc_type = 15; // string doc|sheet|board|slide
  string icon = 16; // string 文档图标
  string cover = 17; // string 封面标识/URL
  bool rag_enabled = 18; // bool 是否允许进入知识库索引
  string content_text = 19; // string 派生纯文本，供搜索摘要/知识库索引/列表预览
}

message CreateDocReq {
  string space_id = 1; // string
  string node_id = 2; // string 可空，空则仅按 space 归属
  string title = 3; // string
  string content_json = 4; // string 初始 block，空则空文档骨架
  string owner_user_id = 5; // string
  string doc_type = 6; // string doc|sheet|board|slide，默认 doc
  string icon = 7; // string
  string cover = 8; // string
  bool rag_enabled = 9; // bool
}
message CreateDocRes {
  string doc_id = 1; // string
}

message GetDocReq {
  string doc_id = 1; // string
  string user_id = 2; // string 鉴权主体
}
message GetDocRes {
  DocItem doc = 1; // 文档详情（含 content_json）
}

message UpdateDocMetaReq {
  string doc_id = 1; // string
  string title = 2; // string 空表示不改
  int32 status = 4; // int32 0 表示不改
  string operator_user_id = 5; // string
  string icon = 6; // string 空表示不改
  string cover = 7; // string 空表示不改
  string doc_type = 8; // string 空表示不改
  bool rag_enabled = 9; // bool 与 rag_enabled_set 配合，避免 false 与「未设置」混淆
  bool rag_enabled_set = 10; // bool 是否要更新 rag_enabled
}
message UpdateDocMetaRes {}

message DeleteDocReq {
  string doc_id = 1; // string 软删
  string operator_user_id = 2; // string
}
message DeleteDocRes {}

// 协同/HTTP 保存正文：落 content_json + 派生 content_text，bump version，生成 revision。
message SaveDocContentReq {
  string doc_id = 1; // string
  string content_json = 2; // string block 快照
  string content_text = 3; // string 派生纯文本（由网关 yjs-go 解码或编辑器上传）
  string operator_user_id = 4; // string
}
message SaveDocContentRes {
  int32 version = 1; // int32 保存后新版本
}

// ==================== 协同持久化原语（供 doc_api 协同网关调用）====================

// 拉取某文档的 Yjs 初始状态：最近一次快照 + 快照之后的增量 update 列表。
message GetDocSyncStateReq {
  string doc_id = 1; // string
  int32 epoch = 2; // int32 协同纪元；只返回该纪元的状态
}
message GetDocSyncStateRes {
  bytes snapshot = 1; // bytes 压缩后的 Yjs 全量 state（lib0 编码），无则空
  repeated bytes updates = 2; // bytes[] 快照之后的增量 update，按时序
  int32 version = 3; // int32 当前版本
  int32 epoch = 4; // int32 实际生效的纪元
}

// 追加一条客户端 Yjs update（增量日志，重放/合并用）。
message AppendDocUpdateReq {
  string doc_id = 1; // string
  bytes update = 2; // bytes Yjs update 二进制
  string origin_user_id = 3; // string
  int32 epoch = 4; // int32 协同纪元
}
message AppendDocUpdateRes {
  int64 seq = 1; // int64 写入的递增序号
}

// 压实：提交一份新的全量快照，并可同时携带解码后的正文以更新权威文档 + 生成版本。
message CommitDocSnapshotReq {
  string doc_id = 1; // string
  bytes snapshot = 2; // bytes 全量 state
  string content_json = 3; // string 解码 block 快照
  string content_text = 4; // string 派生纯文本
  string operator_user_id = 5; // string
  int32 epoch = 6; // int32 协同纪元
}
message CommitDocSnapshotRes {
  int32 version = 1; // int32 压实后版本
}

// ==================== 权限 / 分享（permission）====================

message PermItem {
  uint64 id = 1; // uint64
  string resource_type = 2; // string space|doc
  string resource_id = 3; // string
  string principal_type = 4; // string user|group|dept
  string principal_id = 5; // string
  string role = 6; // string owner|editor|commenter|viewer
}

message SetPermissionReq {
  string resource_type = 1; // string space|doc
  string resource_id = 2; // string
  string principal_type = 3; // string user|group|dept
  string principal_id = 4; // string
  string role = 5; // string editor|commenter|viewer（owner 不通过此接口授予）
  string operator_user_id = 6; // string 需对该资源有管理权
}
message SetPermissionRes {}

message DeletePermissionReq {
  string resource_type = 1; // string
  string resource_id = 2; // string
  string principal_type = 3; // string
  string principal_id = 4; // string
  string operator_user_id = 5; // string
}
message DeletePermissionRes {}

message ListPermissionsReq {
  string resource_type = 1; // string
  string resource_id = 2; // string
}
message ListPermissionsRes {
  repeated PermItem permissions = 1; // array
}

// 计算某主体对某资源的有效角色（含经 space 继承）。owner/editor/commenter/viewer/""。
message CheckPermissionReq {
  string resource_type = 1; // string space|doc
  string resource_id = 2; // string
  string user_id = 3; // string
}
message CheckPermissionRes {
  string role = 1; // string 有效角色，无权限为空串
}

// ==================== 版本历史（revision）====================

message RevisionItem {
  string revision_id = 1; // string
  string doc_id = 2; // string
  int32 version = 3; // int32
  string title = 4; // string
  string label = 5; // string 用户命名
  string created_by = 6; // string
  string created_at = 7; // string RFC3339
}

message ListRevisionsReq {
  string doc_id = 1; // string
  int32 page = 2; // int32
  int32 page_size = 3; // int32
}
message ListRevisionsRes {
  int64 total = 1; // int64
  repeated RevisionItem revisions = 2; // array
}

message GetRevisionReq {
  string revision_id = 1; // string
}
message GetRevisionRes {
  RevisionItem revision = 1; // 元信息
  string content_json = 2; // string 该版本 block 快照
}

message RollbackRevisionReq {
  string doc_id = 1; // string
  string revision_id = 2; // string
  string operator_user_id = 3; // string
}
message RollbackRevisionRes {
  int32 version = 1; // int32 回滚产生的新版本
  int32 epoch = 2; // int32 回滚后的新纪元，客户端据此重建协同房间
}

// ==================== 文件导入（import）====================

// 从上传文件（docx/pdf）导入生成一篇文档：解析正文 -> 建 node + doc。
message ImportDocReq {
  string space_id = 1; // string 目标空间
  string parent_node_id = 2; // string 目标文件夹节点，空则挂空间根
  string title = 3; // string 文档标题，空则取文件名
  string file_name = 4; // string 原始文件名（据后缀判定 docx/pdf）
  bytes data = 5; // bytes 文件二进制
  string operator_user_id = 6; // string
}
message ImportDocRes {
  string doc_id = 1; // string
  string node_id = 2; // string
  string content_text = 3; // string 解析出的纯文本
  string file_kind = 4; // string docx|pdf|unsupported
  bool parsed = 5; // bool 是否成功解析正文（pdf 依赖缺失时 false，仅登记附件不解析）
  string message = 6; // string 解析状态说明
}

// ==================== 内部：知识库按 ID 读取正文 ====================

// 供平台知识库导入/自动同步按 doc_id 读取权威快照；服务间内部调用，不做用户鉴权。
message GetDocContentReq {
  string doc_id = 1; // string
}
message GetDocContentRes {
  string doc_id = 1; // string
  string title = 2; // string
  string content_text = 3; // string 派生纯文本
  int32 version = 4; // int32 版本号，作为知识快照 revision
  int32 status = 5; // int32 1启用 2停用
}

// ==================== 评论 / 批注 / @提及（comment）====================

// 评论锚定到 editor 写入 PM node attrs 的 anchor_id；quote 保留选中文本快照，
// 正文漂移后仍可定位。parent_id 非空即为回复，解决状态只挂在顶层评论上。
message CommentItem {
  string comment_id = 1;
  string doc_id = 2;
  int32 epoch = 3;
  string parent_id = 4;
  string anchor_id = 5;
  string quote = 6;
  string content = 7;
  string mentions = 8; // 被 @ 的用户 ID，逗号分隔
  string created_by = 9;
  bool resolved = 10;
  string resolved_by = 11;
  string resolved_at = 12;
  string created_at = 13;
  repeated CommentItem replies = 14;
}
message CreateCommentReq {
  string doc_id = 1;
  string parent_id = 2;
  string anchor_id = 3;
  string quote = 4;
  string content = 5;
  string mentions = 6;
  string operator_user_id = 7;
}
message CreateCommentRes {
  CommentItem comment = 1;
}
message ListCommentsReq {
  string doc_id = 1;
  bool include_resolved = 2;
  string operator_user_id = 3;
}
message ListCommentsRes {
  int64 total = 1;
  repeated CommentItem comments = 2;
}
message ResolveCommentReq {
  string comment_id = 1;
  bool resolved = 2;
  string operator_user_id = 3;
}
message ResolveCommentRes {}
message DeleteCommentReq {
  string comment_id = 1;
  string operator_user_id = 2;
}
message DeleteCommentRes {}

// ==================== 分享链接（share link）====================

message ShareLinkItem {
  string link_id = 1;
  string token = 2;
  string resource_type = 3;
  string resource_id = 4;
  string scope = 5; // anyone|org|invited
  string role = 6;
  bool has_password = 7;
  string expires_at = 8;
  bool allow_download = 9;
  bool allow_copy = 10;
  bool allow_comment = 11;
  bool watermark = 12;
  int64 view_count = 13;
  string created_by = 14;
  int32 status = 15;
  string url = 16;
}
message SetShareLinkReq {
  string resource_type = 1;
  string resource_id = 2;
  string scope = 3;
  string role = 4;
  string password = 5;
  string expires_at = 6;
  bool allow_download = 7;
  bool allow_copy = 8;
  bool allow_comment = 9;
  bool watermark = 10;
  string operator_user_id = 11;
}
message SetShareLinkRes {
  ShareLinkItem link = 1;
}
message GetShareLinkReq {
  string resource_type = 1;
  string resource_id = 2;
  string operator_user_id = 3;
}
message GetShareLinkRes {
  ShareLinkItem link = 1;
}
message RevokeShareLinkReq {
  string link_id = 1;
  string operator_user_id = 2;
}
message RevokeShareLinkRes {}
message ResolveShareLinkReq {
  string token = 1;
  string password = 2;
  string user_id = 3;
}
message ResolveShareLinkRes {
  string resource_type = 1;
  string resource_id = 2;
  string role = 3;
  string doc_id = 4;
  string title = 5;
  bool allow_download = 6;
  bool allow_copy = 7;
  bool allow_comment = 8;
  bool watermark = 9;
}

// ==================== 回收站（trash）====================

message TrashItem {
  string trash_id = 1;
  string resource_type = 2;
  string resource_id = 3;
  string title = 4;
  string space_id = 5;
  string parent_id = 6;
  string deleted_by = 7;
  string deleted_at = 8;
}
message ListTrashReq {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message ListTrashRes {
  int64 total = 1;
  repeated TrashItem items = 2;
}
message RestoreTrashReq {
  string trash_id = 1;
  string operator_user_id = 2;
}
message RestoreTrashRes {
  string resource_type = 1;
  string resource_id = 2;
}
message PurgeTrashReq {
  string trash_id = 1;
  string operator_user_id = 2;
}
message PurgeTrashRes {}
message EmptyTrashReq {
  string operator_user_id = 1;
}
message EmptyTrashRes {
  int32 purged = 1;
}

// ==================== 检索 / 最近 / 收藏 / 列表 ====================

message DocSearchItem {
  DocItem doc = 1;
  string snippet = 2;
}
message SearchDocsReq {
  string user_id = 1;
  string query = 2;
  string space_id = 3;
  string doc_type = 4;
  int32 page = 5;
  int32 page_size = 6;
}
message SearchDocsRes {
  int64 total = 1;
  repeated DocSearchItem items = 2;
}
message ListDocsReq {
  string space_id = 1;
  string user_id = 2;
  string doc_type = 3;
  int32 page = 4;
  int32 page_size = 5;
}
message ListDocsRes {
  int64 total = 1;
  repeated DocItem docs = 2;
}
message RecordVisitReq {
  string doc_id = 1;
  string user_id = 2;
}
message RecordVisitRes {}
message ListRecentReq {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message ListRecentRes {
  int64 total = 1;
  repeated DocItem docs = 2;
}
message SetFavoriteReq {
  string doc_id = 1;
  string user_id = 2;
  bool favorite = 3;
}
message SetFavoriteRes {
  bool favorite = 1;
}
message ListFavoritesReq {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message ListFavoritesRes {
  int64 total = 1;
  repeated DocItem docs = 2;
}

// ==================== 模板中心（template）====================

message TemplateItem {
  string template_id = 1;
  string name = 2;
  string category = 3;
  string description = 4;
  string cover = 5;
  string content_json = 6;
  string doc_type = 7;
  string scope = 8;
  string owner_user_id = 9;
  int32 use_count = 10;
  int32 status = 11;
  string created_at = 12;
}
message ListTemplatesReq {
  string user_id = 1;
  string category = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message ListTemplatesRes {
  int64 total = 1;
  repeated TemplateItem templates = 2;
}
message CreateTemplateReq {
  string name = 1;
  string category = 2;
  string description = 3;
  string cover = 4;
  string content_json = 5;
  string doc_type = 6;
  string scope = 7;
  string operator_user_id = 8;
}
message CreateTemplateRes {
  string template_id = 1;
}
message InstantiateTemplateReq {
  string template_id = 1;
  string space_id = 2;
  string parent_node_id = 3;
  string title = 4;
  string operator_user_id = 5;
}
message InstantiateTemplateRes {
  string doc_id = 1;
  string node_id = 2;
}
message DeleteTemplateReq {
  string template_id = 1;
  string operator_user_id = 2;
}
message DeleteTemplateRes {}

// ==================== 导出 / 复制（export & duplicate）====================

message ExportDocReq {
  string doc_id = 1;
  string format = 2; // md|html|txt|json|docx
  string operator_user_id = 3;
}
message ExportDocRes {
  string file_name = 1;
  string mime_type = 2;
  string data = 3; // base64（docx）或 utf-8 文本（md/html/txt/json）
  string text = 4; // 文本格式时与 data 同值，便于直接预览
}
message DuplicateDocReq {
  string doc_id = 1;
  string space_id = 2;
  string parent_node_id = 3;
  string title = 4;
  string operator_user_id = 5;
}
message DuplicateDocRes {
  string doc_id = 1;
  string node_id = 2;
}

// ==================== 富媒体块（多维表格 / 画板）====================

message DocBlockItem {
  string block_id = 1;
  string doc_id = 2;
  string kind = 3; // sheet|board
  string title = 4;
  string payload_json = 5;
  int32 version = 6;
  string updated_by = 7;
  string updated_at = 8;
}
message SaveDocBlockReq {
  string doc_id = 1;
  string block_id = 2; // 空则新建
  string kind = 3;
  string title = 4;
  string payload_json = 5;
  string operator_user_id = 6;
}
message SaveDocBlockRes {
  DocBlockItem block = 1;
}
message ListDocBlocksReq {
  string doc_id = 1;
  string user_id = 2;
}
message ListDocBlocksRes {
  repeated DocBlockItem blocks = 1;
}
message DeleteDocBlockReq {
  string doc_id = 1;
  string block_id = 2;
  string operator_user_id = 3;
}
message DeleteDocBlockRes {}

// ==================== 版本增强（命名 / 对比）====================

message LabelRevisionReq {
  string revision_id = 1;
  string label = 2;
  string operator_user_id = 3;
}
message LabelRevisionRes {}
message DiffRevisionsReq {
  string doc_id = 1;
  string base_revision_id = 2;
  string target_revision_id = 3;
  string user_id = 4;
}
message DiffRevisionsRes {
  string base_content_json = 1;
  string target_content_json = 2;
  string base_text = 3;
  string target_text = 4;
  repeated string added_lines = 5;
  repeated string removed_lines = 6;
}

// ==================== 通知中心（notification）====================

message NotificationItem {
  string notification_id = 1;
  string user_id = 2;
  string doc_id = 3;
  string kind = 4;
  string actor_user_id = 5;
  string title = 6;
  string excerpt = 7;
  bool is_read = 8;
  string created_at = 9;
}
message ListNotificationsReq {
  string user_id = 1;
  bool unread_only = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message ListNotificationsRes {
  int64 total = 1;
  int64 unread = 2;
  repeated NotificationItem items = 3;
}
message MarkNotificationReadReq {
  string user_id = 1;
  string notification_id = 2; // 空 + all=true 表示全部已读
  bool all = 3;
}
message MarkNotificationReadRes {
  int64 unread = 1;
}

// ==================== 操作审计（audit）====================

message AuditLogItem {
  string log_id = 1;
  string actor_user_id = 2;
  string action = 3;
  string resource_type = 4;
  string resource_id = 5;
  string detail = 6;
  string created_at = 7;
}
message ListAuditLogsReq {
  string actor_user_id = 1;
  string action = 2;
  string resource_type = 3;
  string resource_id = 4;
  int32 page = 5;
  int32 page_size = 6;
}
message ListAuditLogsRes {
  int64 total = 1;
  repeated AuditLogItem logs = 2;
}

// ==================== 知识库索引联动（outbox）====================

message SetKnowledgeSyncReq {
  string doc_id = 1;
  bool rag_enabled = 2;
  string operator_user_id = 3;
}
message SetKnowledgeSyncRes {
  bool rag_enabled = 1;
}
message ReindexDocReq {
  string doc_id = 1;
  string operator_user_id = 2;
}
message ReindexDocRes {
  int32 version = 1;
  string status = 2; // queued|disabled
  string digest = 3;
}
message IndexOutboxItem {
  string doc_id = 1;
  int32 version = 2;
  string digest = 3;
  string status = 4;
  int32 attempts = 5;
  string created_at = 6;
}
message ListIndexOutboxReq {
  string status = 1;
  int32 limit = 2;
}
message ListIndexOutboxRes {
  repeated IndexOutboxItem items = 1;
}
message AckIndexOutboxReq {
  repeated string keys = 1; // "doc_id:version"
  string status = 2; // done|failed
}
message AckIndexOutboxRes {
  int32 updated = 1;
}

// ==================== 协作者 / 协同房间 ====================

message CollaboratorItem {
  string user_id = 1;
  string role = 2;
  string principal_type = 3;
  string source = 4; // owner|space|doc
}
message ListCollaboratorsReq {
  string doc_id = 1;
  string user_id = 2;
}
message ListCollaboratorsRes {
  repeated CollaboratorItem collaborators = 1;
}
message ResolveRoomEpochReq {
  string doc_id = 1;
  int32 epoch = 2;
}
message ResolveRoomEpochRes {
  bool valid = 1;
  int32 epoch = 2;
}

service doc {
  rpc CreateSpace(CreateSpaceReq) returns (CreateSpaceRes);
  rpc UpdateSpace(UpdateSpaceReq) returns (UpdateSpaceRes);
  rpc DeleteSpace(DeleteSpaceReq) returns (DeleteSpaceRes);
  rpc GetSpace(GetSpaceReq) returns (GetSpaceRes);
  rpc ListSpaces(ListSpacesReq) returns (ListSpacesRes);

  rpc CreateNode(CreateNodeReq) returns (CreateNodeRes);
  rpc UpdateNode(UpdateNodeReq) returns (UpdateNodeRes);
  rpc DeleteNode(DeleteNodeReq) returns (DeleteNodeRes);
  rpc ListNodes(ListNodesReq) returns (ListNodesRes);

  rpc CreateDoc(CreateDocReq) returns (CreateDocRes);
  rpc GetDoc(GetDocReq) returns (GetDocRes);
  rpc UpdateDocMeta(UpdateDocMetaReq) returns (UpdateDocMetaRes);
  rpc DeleteDoc(DeleteDocReq) returns (DeleteDocRes);
  rpc SaveDocContent(SaveDocContentReq) returns (SaveDocContentRes);

  rpc GetDocSyncState(GetDocSyncStateReq) returns (GetDocSyncStateRes);
  rpc AppendDocUpdate(AppendDocUpdateReq) returns (AppendDocUpdateRes);
  rpc CommitDocSnapshot(CommitDocSnapshotReq) returns (CommitDocSnapshotRes);

  rpc SetPermission(SetPermissionReq) returns (SetPermissionRes);
  rpc DeletePermission(DeletePermissionReq) returns (DeletePermissionRes);
  rpc ListPermissions(ListPermissionsReq) returns (ListPermissionsRes);
  rpc CheckPermission(CheckPermissionReq) returns (CheckPermissionRes);

  rpc ListRevisions(ListRevisionsReq) returns (ListRevisionsRes);
  rpc GetRevision(GetRevisionReq) returns (GetRevisionRes);
  rpc RollbackRevision(RollbackRevisionReq) returns (RollbackRevisionRes);

  rpc ImportDoc(ImportDocReq) returns (ImportDocRes);

  rpc GetDocContent(GetDocContentReq) returns (GetDocContentRes);

  rpc CreateComment(CreateCommentReq) returns (CreateCommentRes);
  rpc ListComments(ListCommentsReq) returns (ListCommentsRes);
  rpc ResolveComment(ResolveCommentReq) returns (ResolveCommentRes);
  rpc DeleteComment(DeleteCommentReq) returns (DeleteCommentRes);

  rpc SetShareLink(SetShareLinkReq) returns (SetShareLinkRes);
  rpc GetShareLink(GetShareLinkReq) returns (GetShareLinkRes);
  rpc RevokeShareLink(RevokeShareLinkReq) returns (RevokeShareLinkRes);
  rpc ResolveShareLink(ResolveShareLinkReq) returns (ResolveShareLinkRes);

  rpc ListTrash(ListTrashReq) returns (ListTrashRes);
  rpc RestoreTrash(RestoreTrashReq) returns (RestoreTrashRes);
  rpc PurgeTrash(PurgeTrashReq) returns (PurgeTrashRes);
  rpc EmptyTrash(EmptyTrashReq) returns (EmptyTrashRes);

  rpc SearchDocs(SearchDocsReq) returns (SearchDocsRes);
  rpc ListDocs(ListDocsReq) returns (ListDocsRes);
  rpc RecordVisit(RecordVisitReq) returns (RecordVisitRes);
  rpc ListRecent(ListRecentReq) returns (ListRecentRes);
  rpc SetFavorite(SetFavoriteReq) returns (SetFavoriteRes);
  rpc ListFavorites(ListFavoritesReq) returns (ListFavoritesRes);

  rpc ListTemplates(ListTemplatesReq) returns (ListTemplatesRes);
  rpc CreateTemplate(CreateTemplateReq) returns (CreateTemplateRes);
  rpc InstantiateTemplate(InstantiateTemplateReq) returns (InstantiateTemplateRes);
  rpc DeleteTemplate(DeleteTemplateReq) returns (DeleteTemplateRes);

  rpc ExportDoc(ExportDocReq) returns (ExportDocRes);
  rpc DuplicateDoc(DuplicateDocReq) returns (DuplicateDocRes);

  rpc SaveDocBlock(SaveDocBlockReq) returns (SaveDocBlockRes);
  rpc ListDocBlocks(ListDocBlocksReq) returns (ListDocBlocksRes);
  rpc DeleteDocBlock(DeleteDocBlockReq) returns (DeleteDocBlockRes);

  rpc LabelRevision(LabelRevisionReq) returns (LabelRevisionRes);
  rpc DiffRevisions(DiffRevisionsReq) returns (DiffRevisionsRes);

  rpc ListNotifications(ListNotificationsReq) returns (ListNotificationsRes);
  rpc MarkNotificationRead(MarkNotificationReadReq) returns (MarkNotificationReadRes);

  rpc ListAuditLogs(ListAuditLogsReq) returns (ListAuditLogsRes);

  rpc SetKnowledgeSync(SetKnowledgeSyncReq) returns (SetKnowledgeSyncRes);
  rpc ReindexDoc(ReindexDocReq) returns (ReindexDocRes);
  rpc ListIndexOutbox(ListIndexOutboxReq) returns (ListIndexOutboxRes);
  rpc AckIndexOutbox(AckIndexOutboxReq) returns (AckIndexOutboxRes);

  rpc ListCollaborators(ListCollaboratorsReq) returns (ListCollaboratorsRes);
  rpc ResolveRoomEpoch(ResolveRoomEpochReq) returns (ResolveRoomEpochRes);
}

