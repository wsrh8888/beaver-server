Name: asset
Host: 0.0.0.0
Port: 20600
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Level: info
  Stat: false
Domain: "http://192.168.3.4:20800"
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_asset?charset=utf8mb4&parseTime=True&loc=Local
Redis:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
Etcd: 127.0.0.1:2379
RocketMQ:
  Addr: 127.0.0.1:9876

FileMaxSize:
  image: 2
  video: 10
  audio: 2
  archive: 2
  document: 2
  unknown: 10
MaxBytes: 1073741824 # 1GB - go-zero HTTP服务器最大请求体大小

# 通用上传接口(/beaver/api/asset/file/v1/upload)使用的默认存储后端：local|qiniu|minio
StorageType: local

# 本地存储配置
Local:
  UploadDir: ../../../static # 本地文件上传目录(相对路径，相对于程序运行目录)
  ProjectName: beaver # 项目名称，用于文件路径前缀（为空则使用根目录）

# 七牛云配置
Qiniu:
  ProjectName: beaver # 项目名称，用于文件路径前缀（为空则使用根目录）
  AK: your_qiniu_access_key
  SK: your_qiniu_secret_key
  Bucket: your_qiniu_bucket_name
  Domain: "your_qiniu_domain" # 七牛云文件访问域名（必填，用于拼接完整URL）
  ExpireTime: 3600 # 签名URL有效期, 单位：秒

# MinIO配置
Minio:
  Endpoint: 127.0.0.1:9000 # MinIO服务地址
  AccessKey: minioadmin
  SecretKey: minioadmin
  Bucket: beaver # 存储桶名称
  UseSSL: false # 是否启用SSL
  ProjectName: beaver # 项目名称，用于文件路径前缀（为空则使用根目录）
WhiteList:
  - png
  - jpg
  - jpeg
  - gif
  - webp
  - mp4
  - mp3
  - m4a
  - aac
  - pdf
  - exe
  - wav

BlackList:
  - sh
  - bat
UserRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
# asset_rpc：file + emoji 同进程（etcd assetrpc.rpc）
AssetRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: assetrpc.rpc

# 用户 JWT 签名密钥：本服务独立签发并校验用户票，不信任外部塞的 Beaver-User-Id。
Auth:
  AccessSecret: f81d1b2d8f69a503d848a2ad0b9908186bc435d36cf5a885c33491b51613240f38ff672700d60ffdf19466cc9a687620
  AccessExpire: 3600
# 入站 S2S 机器票：本团队业务面共用一套凭据，票据受众统一 core:api。
# 换票端点：POST /beaver/api/account/auth_token/v1/issue（client_credentials）。
S2S:
  Secret: beaver-s2s-01-core
  Clients:
    beaver-backend:
      ClientID: beaver-backend
      ClientSecret: beaver-s2s-01-core-backend
      Scopes: []
      Enabled: true
    beaver-open:
      ClientID: beaver-open
      ClientSecret: beaver-s2s-01-core-open
      Scopes: []
      Enabled: true
    beaver-social:
      ClientID: beaver-social
      ClientSecret: beaver-s2s-01-core-social
      Scopes: []
      Enabled: true
    beaver-call:
      ClientID: beaver-call
      ClientSecret: beaver-s2s-01-core-call
      Scopes: []
      Enabled: true

