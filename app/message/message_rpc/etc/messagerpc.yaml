# 出站 S2S 端点注册表：key 是对端团队/服务名，值是对方网关地址与鉴权方式。
# 跨团队一律走对方网关的 /internal/<Module>.<Method>，禁止 etcd gRPC 直连、禁止引用对方代码。
RemoteProxy:
  Open:
    BaseURL: http://127.0.0.1:21900
    Auth: client_credentials
    ClientID: beaver-server
    ClientSecret: s2s-dev-secret
  Ai:
    BaseURL: http://127.0.0.1:22200
    Auth: client_credentials
    ClientID: beaver-server
    ClientSecret: s2s-dev-secret
  Agent:
    BaseURL: http://127.0.0.1:22300
    Auth: internal_token
    InternalToken: ""
Name: message_rpc
ListenOn: 0.0.0.0:30300
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: messagerpc.rpc
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_message?charset=utf8mb4&parseTime=True&loc=Local
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
RedisConf:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
DatasyncRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: datasyncrpc.rpc
UserRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
FriendRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
GroupRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
PlatformRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: platformrpc.rpc
RocketMQ:
  Addr: 127.0.0.1:9876
Push:
  Enabled: false
  FCM:
    Enabled: false
    ProjectID: ""
    CredentialsFile: ""
  APNs:
    Enabled: false
    KeyFile: ""
    KeyID: ""
    TeamID: ""
    BundleID: ""
    Production: false
