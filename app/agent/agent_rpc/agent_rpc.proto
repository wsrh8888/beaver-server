syntax = "proto3";

package agent;

option go_package = "./agent_rpc";

// 内部服务。有进程内态的方法 + 同步拉取（结果走 Reply.result_json）。
// 权威定义在 beaver-agent/agent_server/grpc/agent/agent_rpc.proto，两边须保持一致。
service Agent {
  rpc SendMessage(SendMessageReq) returns (Reply);
  rpc SubmitHostResult(SubmitHostResultReq) returns (Reply);
  // 模型改/删后通知 rpc 进程作废缓存实例(跨进程失效)。
  rpc InvalidateModel(InvalidateModelReq) returns (Reply);

  // 桌面 datasync：增量列会话（since = 本地游标 version）
  rpc ListConversations(ListConversationsReq) returns (Reply);
  // 列某会话下话题
  rpc ListTopics(ListTopicsReq) returns (Reply);
  // 某话题消息增量（after_version）
  rpc ListMessages(ListMessagesReq) returns (Reply);
}

message Reply {
  int32 code = 1;
  string msg = 2;
  string result_json = 3;
}

message SendMessageReq {
  string user_id = 1;
  string device_id = 2;
  string trace_id = 3;
  string conversation_id = 4;
  string topic_id = 5;
  string model_id = 6;
  string model_source = 7;
  // 多模态 parts JSON 数组（权威用户内容）。
  string parts_json = 8;
  // local=本机空间（可经 HostSession 操作用户目录）；cloud=云端轻会话（无本机文件权限）
  string workspace = 9;
  // default | full；仅 workspace=local 有意义
  string permission_mode = 10;
  string client_msg_id = 11;
}

message SubmitHostResultReq {
  string user_id = 1;
  string request_id = 2;
  bool ok = 3;
  string data_json = 4;
  string error = 5;
}

message InvalidateModelReq {
  string model_id = 1;
}

// since: 只返回 version > since 的会话；0=全量
message ListConversationsReq {
  string user_id = 1;
  int64 since = 2;
  string module = 3;
  int32 limit = 4;
}

message ListTopicsReq {
  string user_id = 1;
  string conversation_id = 2;
}

message ListMessagesReq {
  string user_id = 1;
  string topic_id = 2;
  int64 after_version = 3;
  int64 before_id = 4;
  int32 limit = 5;
}

// goctl rpc protoc agent_rpc.proto --go_out=./types --go-grpc_out=./types --zrpc_out=.
