Name: platform_rpc
ListenOn: 0.0.0.0:31100
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: platformrpc.rpc
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_platform?charset=utf8mb4&parseTime=True&loc=Local
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: userrpc.rpc
DocRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: docrpc.rpc
# 接入通道 API Key 主密钥（32 字节 base64）。下值为本地开发占位，生产必须换成随机密钥并通过部署密钥管理注入。
SecretKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
OpenSearch:
  Addr: http://127.0.0.1:9200
  ChunkIndex: beaver-knowledge-chunks
Index:
  Enabled: true
  IntervalSeconds: 5
  BatchSize: 16
  MaxRetry: 3
  Dims: 1536
  ChunkSize: 800
  Overlap: 80
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
