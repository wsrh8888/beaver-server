syntax = "proto3";

package platform_rpc;

option go_package = "./platform_rpc";

// ==================== 管理后台：客户端日志 ====================

message AdminQueryLogsReq {
  string bucket_id = 1; // string Bucket ID
  string level = 2; // string 日志级别，可选
  int64 start_time = 3; // int64 开始时间戳毫秒
  int64 end_time = 4; // int64 结束时间戳毫秒
  string keyword = 5; // string 关键词，可选
  string user_filter = 6; // string 用户 ID 筛选，可选
  int32 page = 7; // int32 页码
  int32 page_size = 8; // int32 每页条数
}

message AdminLogItem {
  uint64 id = 1; // uint64 日志记录 ID
  string level = 2; // string 日志级别
  string data = 3; // string 日志数据 JSON
  string bucket_id = 4; // string Bucket ID
  string bucket_name = 5; // string Bucket 名称
  int64 timestamp = 6; // int64 时间戳毫秒
  string created_at = 7; // string 创建时间 RFC3339
}

message AdminQueryLogsRes {
  int64 total = 1; // int64 总条数
  repeated AdminLogItem logs = 2; // array 日志列表
}

// ==================== 应用更新（通用，platform_api / backend_admin 共用）====================

message AppItem {
  uint64 id = 1; // uint64 记录 ID
  string app_id = 2; // string 应用唯一标识
  string name = 3; // string 应用名称
  string description = 4; // string 应用描述
  bool is_active = 5; // bool 是否活跃
  string created_at = 6; // string 创建时间
  string updated_at = 7; // string 更新时间
}

message CreateAppReq {
  string name = 1; // string 应用名称
  string description = 2; // string 应用描述
}

message CreateAppRes {
  uint64 id = 1; // uint64 记录 ID
  string app_id = 2; // string 应用唯一标识
}

message ListAppsReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  optional bool is_active = 3; // bool 仅活跃，可选
}

message ListAppsRes {
  int64 total = 1; // int64 总数
  repeated AppItem apps = 2; // array 应用列表
}

message ArchitectureItem {
  uint64 id = 1; // uint64 记录 ID
  string app_id = 2; // string 应用 ID
  string app_name = 3; // string 应用名称
  uint32 platform_id = 4; // uint32 平台 ID
  uint32 arch_id = 5; // uint32 架构 ID
  string description = 6; // string 描述
  bool is_active = 7; // bool 是否启用
  string created_at = 8; // string 创建时间
  string updated_at = 9; // string 更新时间
}

message CreateArchitectureReq {
  string app_id = 1; // string 应用 ID
  uint32 platform_id = 2; // uint32 平台 ID
  uint32 arch_id = 3; // uint32 架构 ID
  string description = 4; // string 描述
}

message CreateArchitectureRes {
  uint64 id = 1; // uint64 记录 ID
}

message UpdateArchitectureReq {
  uint64 id = 1; // uint64 记录 ID
  string description = 2; // string 描述，空表示不修改
  bool is_active = 3; // bool 是否启用
}

message UpdateArchitectureRes {}

message ListArchitecturesReq {
  string app_id = 1; // string 应用 ID 筛选，可选
  int32 page = 2; // int32 页码
  int32 page_size = 3; // int32 每页条数
  optional bool is_active = 4; // bool 仅活跃，可选
}

message ListArchitecturesRes {
  int64 total = 1; // int64 总数
  repeated ArchitectureItem architectures = 2; // array 架构列表
}

message VersionItem {
  uint64 version_id = 1; // uint64 版本 ID
  uint64 architecture_id = 2; // uint64 架构 ID
  string version = 3; // string 版本号
  string file_url = 4; // string 安装包完整 URL
  string description = 5; // string 版本描述
  string release_notes = 6; // string 更新日志
  string created_at = 7; // string 创建时间
  string updated_at = 8; // string 更新时间
}

message CreateVersionReq {
  uint64 architecture_id = 1; // uint64 架构 ID
  string version = 2; // string 版本号
  string file_url = 3; // string 安装包完整 URL
  string description = 4; // string 版本描述
  string release_notes = 5; // string 更新日志
}

message CreateVersionRes {
  uint64 version_id = 1; // uint64 版本 ID
}

message DeleteVersionReq {
  uint64 version_id = 1; // uint64 版本 ID
}

message DeleteVersionRes {}

message ListVersionsReq {
  uint64 architecture_id = 1; // uint64 架构 ID
  int32 page = 2; // int32 页码
  int32 page_size = 3; // int32 每页条数
}

message ListVersionsRes {
  int64 total = 1; // int64 总数
  repeated VersionItem versions = 2; // array 版本列表
}

message AppVersionBrief {
  uint64 version_id = 1; // uint64 版本 ID
  string version = 2; // string 版本号
}

message AppVersionsArchItem {
  uint64 architecture_id = 1; // uint64 架构 ID
  uint32 arch_id = 2; // uint32 架构类型
  string description = 3; // string 架构描述
  repeated AppVersionBrief versions = 4; // array 版本列表
}

message ListAppVersionsReq {
  string app_id = 1; // string 应用 ID
  int32 page = 2; // int32 页码
  int32 page_size = 3; // int32 每页条数
}

message ListAppVersionsRes {
  int64 total = 1; // int64 架构总数
  repeated AppVersionsArchItem architectures = 2; // array 按架构分组的版本
}

message ReleasePolicyItem {
  uint64 id = 1;
  string app_id = 2;
  uint64 architecture_id = 3;
  uint64 stable_version_id = 4;
  uint64 gray_version_id = 5;
  uint32 rollout_percent = 6;
  string min_version = 7;
  bool force_update = 8;
  bool is_active = 9;
  string stable_version = 10;
  string gray_version = 11;
  string created_at = 12;
  string updated_at = 13;
}

message UpsertReleasePolicyReq {
  string app_id = 1;
  uint64 architecture_id = 2;
  uint64 stable_version_id = 3;
  uint64 gray_version_id = 4;
  uint32 rollout_percent = 5;
  string min_version = 6;
  bool force_update = 7;
  bool is_active = 8;
}

message UpsertReleasePolicyRes {
  uint64 id = 1;
}

message ListReleasePoliciesReq {
  string app_id = 1;
}

message ListReleasePoliciesRes {
  repeated ReleasePolicyItem policies = 1;
}

// ==================== 用户反馈（通用）====================

message FeedbackItem {
  uint64 id = 1; // uint64 反馈 ID
  string user_id = 2; // string 提交用户 ID
  string content = 3; // string 反馈内容
  int32 type = 4; // int32 反馈类型
  int32 status = 5; // int32 反馈状态
  repeated string file_names = 6; // array 附件文件名
  int64 handler_id = 7; // int64 处理人 ID
  string handle_time = 8; // string 处理时间 RFC3339
  string handle_result = 9; // string 处理结果
  string created_at = 10; // string 创建时间 RFC3339
  string updated_at = 11; // string 更新时间 RFC3339
}

message SubmitFeedbackReq {
  string user_id = 1; // string 提交用户 ID
  string content = 2; // string 反馈内容
  int32 type = 3; // int32 反馈类型
  repeated string file_names = 4; // array 附件文件名
}

message SubmitFeedbackRes {
  uint64 id = 1; // uint64 反馈 ID
}

message ListFeedbackReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  int32 status = 3; // int32 状态筛选，0 表示全部
  int32 type = 4; // int32 类型筛选，0 表示全部
  string user_id = 5; // string 用户 ID 筛选，可选
  string keywords = 6; // string 关键词，可选
}

message ListFeedbackRes {
  int64 total = 1; // int64 总数
  repeated FeedbackItem list = 2; // array 反馈列表
}

message GetFeedbackReq {
  uint64 id = 1; // uint64 反馈 ID
}

message GetFeedbackRes {
  FeedbackItem feedback = 1; // object 反馈详情
}

message HandleFeedbackReq {
  uint64 id = 1; // uint64 反馈 ID
  int32 status = 2; // int32 处理状态
  string handle_result = 3; // string 处理结果
  string handler_id = 4; // string 处理人 ID
}

message HandleFeedbackRes {}

message DeleteFeedbackReq {
  uint64 id = 1; // uint64 反馈 ID
}

message DeleteFeedbackRes {}

// ==================== 内容举报（通用）====================

message ContentReportItem {
  uint64 id = 1; // uint64 举报 ID
  string reporter_user_id = 2; // string 举报人 ID
  int32 target_type = 3; // int32 对象类型 1用户 2消息 3动态 4群组
  string target_id = 4; // string 对象 ID
  int32 reason_type = 5; // int32 原因类型
  string content = 6; // string 补充说明
  repeated string file_names = 7; // array 证据附件
  int32 status = 8; // int32 状态
  uint64 case_id = 9; // uint64 关联工单 ID
  string handler_id = 10; // string 处理人 ID
  string handle_remark = 11; // string 处理备注
  string created_at = 12; // string 创建时间 RFC3339
}

message SubmitContentReportReq {
  string reporter_user_id = 1; // string 举报人 ID
  int32 target_type = 2; // int32 对象类型
  string target_id = 3; // string 对象 ID
  int32 reason_type = 4; // int32 原因类型
  string content = 5; // string 补充说明
  repeated string file_names = 6; // array 证据附件
}

message SubmitContentReportRes {
  uint64 id = 1; // uint64 举报 ID
}

message ListContentReportsReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  int32 status = 3; // int32 状态筛选，0 全部
  int32 target_type = 4; // int32 对象类型，0 全部
  string target_id = 5; // string 对象 ID，可选
  string reporter_user_id = 6; // string 举报人，可选
}

message ListContentReportsRes {
  int64 total = 1; // int64 总数
  repeated ContentReportItem list = 2; // array 列表
}

message GetContentReportReq {
  uint64 id = 1; // uint64 举报 ID
}

message GetContentReportRes {
  ContentReportItem report = 1; // object 举报详情
}

// UpdateContentReports：举报状态变更（立案/驳回/结案，支持批量）
message UpdateContentReportsReq {
  repeated uint64 ids = 1; // array 举报 ID
  int32 action = 2; // int32 1立案 2驳回 3结案
  string handler_id = 3; // string 处理人 ID
  string handle_remark = 4; // string 备注
  uint64 case_id = 5; // uint64 关联工单 ID（action=1 时）
}

message UpdateContentReportsRes {
  int64 affected_count = 1; // int64 影响条数
}

// ==================== 工作台应用（IM 运营配置）====================

message WorkbenchEntryConfig {
  int32 type = 1; // int32 入口类型 0路由key 1H5地址
  string pc = 2; // string PC 入口
  string mobile = 3; // string 移动端入口
}

message WorkbenchAppItem {
  uint64 id = 1; // uint64 记录 ID
  string workbench_app_id = 2; // string 应用业务 ID
  string name = 3; // string 应用名称
  string description = 4; // string 应用描述
  string icon = 5; // string 图标 URL
  int32 app_type = 6; // int32 类型 0内部 1第三方H5
  int32 client_scope = 7; // int32 可见端 0全部 1仅PC 2仅移动
  WorkbenchEntryConfig entry_config = 8; // object 入口配置
  int32 category = 9; // int32 分类
  int32 sort = 10; // int32 排序
  int32 status = 11; // int32 状态 0下架 1上架
  string created_by = 12; // string 创建人
  string last_modified_by = 13; // string 最后修改人
  string remark = 14; // string 运营备注
  string created_at = 15; // string 创建时间
  string updated_at = 16; // string 更新时间
  int32 open_mode = 17; // int32 打开方式 0内嵌 1系统浏览器
}

message WorkbenchAppPublicItem {
  string workbench_app_id = 1; // string 应用业务 ID
  string name = 2; // string 应用名称
  string description = 3; // string 应用描述
  string icon = 4; // string 图标 URL
  int32 app_type = 5; // int32 类型 0内部 1第三方H5
  int32 client_scope = 6; // int32 可见端
  WorkbenchEntryConfig entry_config = 7; // object 入口配置
  int32 category = 8; // int32 分类
  int32 sort = 9; // int32 排序
  int32 open_mode = 10; // int32 打开方式 0内嵌 1系统浏览器
}

message CreateWorkbenchAppReq {
  string name = 1; // string 应用名称
  string description = 2; // string 应用描述
  string icon = 3; // string 图标 URL
  int32 app_type = 4; // int32 类型 0内部 1第三方H5
  int32 client_scope = 5; // int32 可见端
  WorkbenchEntryConfig entry_config = 6; // object 入口配置
  int32 category = 7; // int32 分类
  int32 sort = 8; // int32 排序
  int32 status = 9; // int32 状态 0下架 1上架
  string remark = 10; // string 运营备注
  string operator_id = 11; // string 操作人(管理员 ID)
  int32 open_mode = 12; // int32 打开方式 0内嵌 1系统浏览器
}

message CreateWorkbenchAppRes {
  string workbench_app_id = 1; // string 应用业务 ID
}

message UpdateWorkbenchAppReq {
  string workbench_app_id = 1; // string 应用业务 ID
  string name = 2; // string 应用名称，空不修改
  string description = 3; // string 应用描述，空不修改
  string icon = 4; // string 图标 URL，空不修改
  optional int32 app_type = 5; // int32 类型，可选
  optional int32 client_scope = 6; // int32 可见端，可选
  WorkbenchEntryConfig entry_config = 7; // object 入口配置，nil 不修改
  optional int32 category = 8; // int32 分类，可选
  optional int32 sort = 9; // int32 排序，可选
  optional int32 status = 10; // int32 状态，可选
  string remark = 11; // string 运营备注，空不修改
  string operator_id = 12; // string 操作人(管理员 ID)
  optional int32 open_mode = 13; // int32 打开方式，可选
}

message UpdateWorkbenchAppRes {}

message DeleteWorkbenchAppReq {
  string workbench_app_id = 1; // string 应用业务 ID
}

message DeleteWorkbenchAppRes {}

message GetWorkbenchAppReq {
  string workbench_app_id = 1; // string 应用业务 ID
}

message GetWorkbenchAppRes {
  WorkbenchAppItem app = 1; // object 应用详情
}

message ListWorkbenchAppsReq {
  int32 page = 1; // int32 页码
  int32 page_size = 2; // int32 每页条数
  int32 status = 3; // int32 状态筛选，0 不过滤（用 -1？保持兼容：>0 才筛；category 用 optional）
  optional int32 category = 4; // int32 分类筛选，可选
  string keywords = 5; // string 关键词，可选
}

message ListWorkbenchAppsRes {
  int64 total = 1; // int64 总数
  repeated WorkbenchAppItem list = 2; // array 列表
}

message ListEnabledWorkbenchAppsReq {
  optional int32 category = 1; // int32 分类筛选，可选
  int32 client_scope = 2; // int32 端筛选 0全部 1PC 2移动
}

message ListEnabledWorkbenchAppsRes {
  repeated WorkbenchAppPublicItem list = 1; // array 上架应用列表
}

// ==================== 组织（后台调整：新增、修改、删除）====================

message CreateOrgDepartmentReq {
  string parent_id = 1; // string 父部门 ID，必须已存在
  string name = 2; // string 部门名
}

message CreateOrgDepartmentRes {
  string dept_id = 1; // string 新部门 ID
}

message UpdateOrgDepartmentReq {
  string dept_id = 1; // string 部门 ID
  optional string parent_id = 2; // string 新父部门，不传则不改。根部门不能改父级
  optional string name = 3; // string 新名称，不传则不改
  optional int32 sort = 4; // int32 新排序，不传则不改
}

message UpdateOrgDepartmentRes {}

message DeleteOrgDepartmentReq {
  string dept_id = 1; // string 部门 ID
}

message DeleteOrgDepartmentRes {}

message AddOrgMemberReq {
  string user_id = 1; // string 已注册用户 ID
  string dept_id = 2; // string 目标部门
}

message AddOrgMemberRes {}

message RemoveOrgMemberReq {
  string user_id = 1; // string 要移出的用户 ID。不能移出拥有者
}

message RemoveOrgMemberRes {}

// ==================== AI 业务 message ====================

message AgentAppItem {
  uint64 id = 1;
  string app_id = 2;
  string name = 3;
  string scene = 4;
  string system_prompt = 5;
  string llm_model_id = 6;
  string model_params = 7; // JSON
  string tools = 8; // JSON [toolId]
  string mcp_server_ids = 9; // JSON [mcpServerId]
  string knowledge_ids = 10; // JSON [knowledgeId]
  string opening_message = 11;
  string opening_questions = 12; // JSON
  string variables = 13; // JSON
  int32 status = 14;
  int32 sort = 15;
  string created_by = 16;
  string created_at = 17;
  string updated_at = 18;
}

message GetAgentAppReq {
  string app_id = 1;
  string scene = 2; // 可选，按场景取默认应用
}
message GetAgentAppRes {
  AgentAppItem app = 1;
}
message ListAgentAppsReq {
  string scene = 1; // 可选过滤
  int32 status = 2; // 可选，0=全部
  int32 page = 3;
  int32 page_size = 4;
}
message ListAgentAppsRes {
  int64 total = 1;
  repeated AgentAppItem apps = 2;
}
message CreateAgentAppReq {
  string name = 1;
  string scene = 2;
  string system_prompt = 3;
  string llm_model_id = 4;
  string model_params = 5; // JSON
  string tools = 6; // JSON
  string mcp_server_ids = 7; // JSON
  string knowledge_ids = 8; // JSON
  string opening_message = 9;
  string opening_questions = 10; // JSON
  string variables = 11; // JSON
  int32 status = 12;
  int32 sort = 13;
  string created_by = 14;
}
message CreateAgentAppRes {
  string app_id = 1;
}
message UpdateAgentAppReq {
  string app_id = 1;
  string name = 2;
  string scene = 3;
  string system_prompt = 4;
  string llm_model_id = 5;
  string model_params = 6; // JSON
  string tools = 7; // JSON
  string mcp_server_ids = 8; // JSON
  string knowledge_ids = 9; // JSON
  string opening_message = 10;
  string opening_questions = 11; // JSON
  string variables = 12; // JSON
  int32 status = 13;
  int32 sort = 14;
}
message UpdateAgentAppRes {}
message DeleteAgentAppReq {
  string app_id = 1;
}
message DeleteAgentAppRes {}

message AgentModelItem {
  uint64 id = 1;
  string model_id = 2;
  string source = 3; // official|custom
  string user_id = 4;
  string name = 5;
  string provider = 6;
  string model_name = 7;
  string endpoint = 8;
  string api_key = 9; // 接口只出掩码
  int64 context_window = 10;
  int32 max_output_tokens = 11;
  string input_modalities = 12; // JSON
  string output_modalities = 13; // JSON
  int32 max_tokens_flash = 14;
  int32 max_tokens_low = 15;
  int32 max_tokens_medium = 16;
  int32 max_tokens_high = 17;
  string instruction_role = 18;
  bool supports_thinking = 19;
  bool thinking_can_disable = 20;
  string thinking_levels = 21; // JSON
  bool supports_tools = 22;
  bool supports_vision = 23;
  int32 sort = 24;
  int32 status = 25;
}

message GetAgentModelReq {
  string model_id = 1;
  string model_source = 2; // official|custom；空=official
  string user_id = 3; // custom 时按用户取
}
message GetAgentModelRes {
  AgentModelItem model = 1;
}
message ListAgentModelsReq {
  string source = 1; // official|custom；空=全部
  string user_id = 2; // custom 时按用户取
  int32 status = 3; // 0=全部
  int32 page = 4;
  int32 page_size = 5;
}
message ListAgentModelsRes {
  int64 total = 1;
  repeated AgentModelItem models = 2;
}
message CreateAgentModelReq {
  string name = 1;
  string source = 2; // official|custom
  string user_id = 3;
  string provider = 4;
  string model_name = 5;
  string endpoint = 6;
  string api_key = 7;
  int64 context_window = 8;
  int32 max_output_tokens = 9;
  string input_modalities = 10; // JSON
  string output_modalities = 11; // JSON
  int32 max_tokens_flash = 12;
  int32 max_tokens_low = 13;
  int32 max_tokens_medium = 14;
  int32 max_tokens_high = 15;
  string instruction_role = 16;
  bool supports_thinking = 17;
  bool thinking_can_disable = 18;
  string thinking_levels = 19; // JSON
  bool supports_tools = 20;
  bool supports_vision = 21;
  int32 sort = 22;
  int32 status = 23;
}
message CreateAgentModelRes {
  string model_id = 1;
}
message UpdateAgentModelReq {
  string model_id = 1;
  string name = 2;
  string provider = 3;
  string model_name = 4;
  string endpoint = 5;
  string api_key = 6;
  int64 context_window = 7;
  int32 max_output_tokens = 8;
  string input_modalities = 9; // JSON
  string output_modalities = 10; // JSON
  int32 max_tokens_flash = 11;
  int32 max_tokens_low = 12;
  int32 max_tokens_medium = 13;
  int32 max_tokens_high = 14;
  string instruction_role = 15;
  bool supports_thinking = 16;
  bool thinking_can_disable = 17;
  string thinking_levels = 18; // JSON
  bool supports_tools = 19;
  bool supports_vision = 20;
  int32 sort = 21;
  int32 status = 22;
}
message UpdateAgentModelRes {}
message DeleteAgentModelReq {
  string model_id = 1;
  string source = 2; // 必须为 custom
  string user_id = 3;
}
message DeleteAgentModelRes {}

message AgentToolItem {
  uint64 id = 1;
  string tool_id = 2;
  string name = 3;
  string tool_type = 4; // builtin|mcp|api
  string config = 5; // JSON
  int32 status = 6;
  int32 sort = 7;
  string source = 8; // official|custom
  string user_id = 9;
}
message ListAgentToolsReq {
  int32 status = 1; // 0=全部
  string source = 2; // official|custom，空表示全部
}
message ListAgentToolsRes {
  repeated AgentToolItem tools = 1;
}
message GetAgentToolReq {
  string tool_id = 1;
}
message GetAgentToolRes {
  AgentToolItem tool = 1;
}
message CreateAgentToolReq {
  string name = 1;
  string tool_type = 2; // builtin|mcp|api
  string config = 3; // JSON
  int32 status = 4;
  int32 sort = 5;
  string source = 6; // 空则 official
  string user_id = 7;
}
message CreateAgentToolRes {
  string tool_id = 1;
}
message UpdateAgentToolReq {
  string tool_id = 1;
  string name = 2;
  string tool_type = 3;
  string config = 4; // JSON
  int32 status = 5;
  int32 sort = 6;
}
message UpdateAgentToolRes {}
message DeleteAgentToolReq {
  string tool_id = 1;
}
message DeleteAgentToolRes {}

message AgentMcpServerItem {
  uint64 id = 1;
  string mcp_server_id = 2;
  string name = 3;
  string server_name = 4;
  string transport = 5; // stdio|sse|websocket
  string config = 6; // JSON
  string tools = 7; // JSON
  int32 status = 8;
  string source = 9; // official|custom
  string user_id = 10;
}
message ListAgentMcpServersReq {
  int32 status = 1; // 0=全部
  string source = 2; // official|custom，空表示全部
}
message ListAgentMcpServersRes {
  repeated AgentMcpServerItem servers = 1;
}
message GetAgentMcpServerReq {
  string mcp_server_id = 1;
}
message GetAgentMcpServerRes {
  AgentMcpServerItem server = 1;
}
message CreateAgentMcpServerReq {
  string name = 1;
  string server_name = 2;
  string transport = 3; // stdio|sse|websocket
  string config = 4; // JSON 连接配置
  string tools = 5; // JSON 能力清单
  int32 status = 6;
  string source = 7;
  string user_id = 8;
}
message CreateAgentMcpServerRes {
  string mcp_server_id = 1;
}
message UpdateAgentMcpServerReq {
  string mcp_server_id = 1;
  string name = 2;
  string server_name = 3;
  string transport = 4;
  string config = 5; // JSON
  string tools = 6; // JSON
  int32 status = 7;
}
message UpdateAgentMcpServerRes {}
message DeleteAgentMcpServerReq {
  string mcp_server_id = 1;
}
message DeleteAgentMcpServerRes {}

// AiAssistant 某个场景里的唯一智能体，不是用户。scene：assistant/chat/moment/workbench。
message AiAssistantItem {
  string scene = 1;
  string name = 2;
  string system_prompt = 3;
  string llm_model_id = 4;
  string model_params = 5;
  string tools = 6;
  string mcp_server_ids = 7;
  string opening_message = 8;
  int32 status = 9;
}
message GetAiAssistantReq {
  string scene = 1;
}
message GetAiAssistantRes {
  AiAssistantItem assistant = 1;
}
message SaveAiAssistantReq {
  string scene = 1;
  string name = 2;
  string system_prompt = 3;
  string llm_model_id = 4;
  string model_params = 5;
  string tools = 6;
  string mcp_server_ids = 7;
  string opening_message = 8;
  int32 status = 9;
}
message SaveAiAssistantRes {}

message GetLatestWorkspaceReq {
  string user_id = 1;
  string device_id = 2;
}
message GetLatestWorkspaceRes {
  string id = 1;
  string user_id = 2;
  string device_id = 3;
  string name = 4;
  string path = 5;
  int64 version = 6;
}
message SaveWorkspacePathReq {
  string user_id = 1;
  string device_id = 2;
  string workspace_id = 3;
  string path = 4;
}
message SaveWorkspacePathRes {
  string path = 1;
}
message UpsertWorkspaceReq {
  string user_id = 1;
  string device_id = 2;
  string workspace_id = 3;
  string name = 4;
  string path = 5;
}
message UpsertWorkspaceRes {}
message ListWorkspacesByUserReq {
  string user_id = 1;
}
message ListWorkspacesByUserRes {
  repeated GetLatestWorkspaceRes workspaces = 1;
}

service platform {
  rpc AdminQueryLogs(AdminQueryLogsReq) returns (AdminQueryLogsRes);

  rpc CreateApp(CreateAppReq) returns (CreateAppRes);
  rpc ListApps(ListAppsReq) returns (ListAppsRes);
  rpc CreateArchitecture(CreateArchitectureReq) returns (CreateArchitectureRes);
  rpc UpdateArchitecture(UpdateArchitectureReq) returns (UpdateArchitectureRes);
  rpc ListArchitectures(ListArchitecturesReq) returns (ListArchitecturesRes);
  rpc CreateVersion(CreateVersionReq) returns (CreateVersionRes);
  rpc DeleteVersion(DeleteVersionReq) returns (DeleteVersionRes);
  rpc ListVersions(ListVersionsReq) returns (ListVersionsRes);
  rpc ListAppVersions(ListAppVersionsReq) returns (ListAppVersionsRes);
  rpc UpsertReleasePolicy(UpsertReleasePolicyReq) returns (UpsertReleasePolicyRes);
  rpc ListReleasePolicies(ListReleasePoliciesReq) returns (ListReleasePoliciesRes);

  rpc SubmitFeedback(SubmitFeedbackReq) returns (SubmitFeedbackRes);
  rpc ListFeedback(ListFeedbackReq) returns (ListFeedbackRes);
  rpc GetFeedback(GetFeedbackReq) returns (GetFeedbackRes);
  rpc HandleFeedback(HandleFeedbackReq) returns (HandleFeedbackRes);
  rpc DeleteFeedback(DeleteFeedbackReq) returns (DeleteFeedbackRes);

  rpc SubmitContentReport(SubmitContentReportReq) returns (SubmitContentReportRes);
  rpc ListContentReports(ListContentReportsReq) returns (ListContentReportsRes);
  rpc GetContentReport(GetContentReportReq) returns (GetContentReportRes);
  rpc UpdateContentReports(UpdateContentReportsReq) returns (UpdateContentReportsRes);

  rpc CreateWorkbenchApp(CreateWorkbenchAppReq) returns (CreateWorkbenchAppRes);
  rpc UpdateWorkbenchApp(UpdateWorkbenchAppReq) returns (UpdateWorkbenchAppRes);
  rpc DeleteWorkbenchApp(DeleteWorkbenchAppReq) returns (DeleteWorkbenchAppRes);
  rpc GetWorkbenchApp(GetWorkbenchAppReq) returns (GetWorkbenchAppRes);
  rpc ListWorkbenchApps(ListWorkbenchAppsReq) returns (ListWorkbenchAppsRes);
  rpc ListEnabledWorkbenchApps(ListEnabledWorkbenchAppsReq) returns (ListEnabledWorkbenchAppsRes);

  rpc CreateOrgDepartment(CreateOrgDepartmentReq) returns (CreateOrgDepartmentRes);
  rpc UpdateOrgDepartment(UpdateOrgDepartmentReq) returns (UpdateOrgDepartmentRes);
  rpc DeleteOrgDepartment(DeleteOrgDepartmentReq) returns (DeleteOrgDepartmentRes);
  rpc AddOrgMember(AddOrgMemberReq) returns (AddOrgMemberRes);
  rpc RemoveOrgMember(RemoveOrgMemberReq) returns (RemoveOrgMemberRes);

  // ==================== AI 业务（通用配置态：agent/ + ai/）====================

  // —— AI 应用（agent/ 通用，渠道无关）——
  rpc GetAgentApp(GetAgentAppReq) returns (GetAgentAppRes);
  rpc ListAgentApps(ListAgentAppsReq) returns (ListAgentAppsRes);
  rpc CreateAgentApp(CreateAgentAppReq) returns (CreateAgentAppRes);
  rpc UpdateAgentApp(UpdateAgentAppReq) returns (UpdateAgentAppRes);
  rpc DeleteAgentApp(DeleteAgentAppReq) returns (DeleteAgentAppRes);

  // —— 模型目录（agent/ 通用）——
  rpc GetAgentModel(GetAgentModelReq) returns (GetAgentModelRes);
  rpc ListAgentModels(ListAgentModelsReq) returns (ListAgentModelsRes);
  rpc CreateAgentModel(CreateAgentModelReq) returns (CreateAgentModelRes);
  rpc UpdateAgentModel(UpdateAgentModelReq) returns (UpdateAgentModelRes);
  rpc DeleteAgentModel(DeleteAgentModelReq) returns (DeleteAgentModelRes);

  // —— 工具目录（agent/ 通用）——
  rpc GetAgentTool(GetAgentToolReq) returns (GetAgentToolRes);
  rpc ListAgentTools(ListAgentToolsReq) returns (ListAgentToolsRes);
  rpc CreateAgentTool(CreateAgentToolReq) returns (CreateAgentToolRes);
  rpc UpdateAgentTool(UpdateAgentToolReq) returns (UpdateAgentToolRes);
  rpc DeleteAgentTool(DeleteAgentToolReq) returns (DeleteAgentToolRes);

  // —— MCP 服务目录（agent/ 通用）——
  rpc GetAgentMcpServer(GetAgentMcpServerReq) returns (GetAgentMcpServerRes);
  rpc ListAgentMcpServers(ListAgentMcpServersReq) returns (ListAgentMcpServersRes);
  rpc CreateAgentMcpServer(CreateAgentMcpServerReq) returns (CreateAgentMcpServerRes);
  rpc UpdateAgentMcpServer(UpdateAgentMcpServerReq) returns (UpdateAgentMcpServerRes);
  rpc DeleteAgentMcpServer(DeleteAgentMcpServerReq) returns (DeleteAgentMcpServerRes);

  rpc GetAiAssistant(GetAiAssistantReq) returns (GetAiAssistantRes);
  rpc SaveAiAssistant(SaveAiAssistantReq) returns (SaveAiAssistantRes);

  // —— 工作空间/设备（ai/ AI助手桌面端特有）——
  rpc GetLatestWorkspace(GetLatestWorkspaceReq) returns (GetLatestWorkspaceRes);
  rpc SaveWorkspacePath(SaveWorkspacePathReq) returns (SaveWorkspacePathRes);
  rpc UpsertWorkspace(UpsertWorkspaceReq) returns (UpsertWorkspaceRes);
  rpc ListWorkspacesByUser(ListWorkspacesByUserReq) returns (ListWorkspacesByUserRes);
}

