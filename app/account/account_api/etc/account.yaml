# account_rpc：user + auth 同进程（etcd accountrpc.rpc）
AccountRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
RelationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
RocketMQ:
