# RemoteProxy 唯一出站注册表：本仓出站到其它团队走各自网关既有 HTTP 契约 + 机器票 Bearer；
# 外仓打 A 主体（Beaver）统一走 gateway_api 的 /api/... 正常契约，业务能力只有这一套 HTTP 契约；
# 本服务若对外提供 /internal/* 入站端点，那是其它团队的入站面，与 Beaver 出站是两条独立链路。
RemoteProxy:
  Open:
    BaseURL: http://127.0.0.1:21900
    Auth: client_credentials
    ClientID: beaver-server
    ClientSecret: s2s-dev-secret
Name: account
Host: 0.0.0.0
Port: 20100
Log:
  Mode: file
  Path: logs/account_api
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  KeepDays: 7
  Level: info
  Stat: false
Prometheus:
  Host: 0.0.0.0
  Port: 27100
  Path: /metrics
Etcd: 127.0.0.1:2379
Auth:
  AccessSecret: f81d1b2d8f69a503d848a2ad0b9908186bc435d36cf5a885c33491b51613240f38ff672700d60ffdf19466cc9a687620
  AccessExpire: 3600
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_account?charset=utf8mb4&parseTime=True&loc=Local
Redis:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
WhiteList:
  - /api/auth/auth_public/.*
  - /api/settings/open_login_info
  - /api/file/preview
  - /api/update/report
Email:
  QQ:
    Host: smtp.qq.com
    Port: 465
    Username: 751135385@qq.com
    Password: klokenvhymkobaif
  # 未来可以添加其他邮箱服务商
  # Gmail:
  #   Host: smtp.gmail.com
  #   Port: 587
  #   Username: your_gmail@gmail.com
  #   Password: your_gmail_app_password
# account_rpc：user + auth 同进程（etcd accountrpc.rpc）
AccountRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
RelationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
RocketMQ:
  Addr: 127.0.0.1:9876

# 入站 S2S 机器票：本团队业务面共用一套凭据，票据受众统一 core:api。
# 换票端点在本服务：POST /api/auth/token（client_credentials）。
S2S:
  Secret: s2s-dev-secret
  Clients:
    beaver-backend:
      ClientID: beaver-backend
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-open:
      ClientID: beaver-open
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-social:
      ClientID: beaver-social
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-call:
      ClientID: beaver-call
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true

