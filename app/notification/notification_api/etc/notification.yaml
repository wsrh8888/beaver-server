Name: notification
Host: 0.0.0.0
Port: 21000
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_notification?charset=utf8mb4&parseTime=True&loc=Local
Redis:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
Etcd: 127.0.0.1:2379
UserRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
AuthRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
# notification_rpc：本业务线 gRPC 服务（etcd notificationrpc.rpc）
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
FriendRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
ChatRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: messagerpc.rpc
RocketMQ:
  Addr: 127.0.0.1:9876
# 用户 JWT 签名密钥：本服务独立签发并校验用户票，不信任外部塞的 Beaver-User-Id。
Auth:
  AccessSecret: f81d1b2d8f69a503d848a2ad0b9908186bc435d36cf5a885c33491b51613240f38ff672700d60ffdf19466cc9a687620
  AccessExpire: 3600
# 入站 S2S 机器票：本团队业务面共用一套凭据，票据受众统一 core:api。
# 换票端点：POST /beaver/api/account/auth_token/v1/issue（client_credentials）。
S2S:
  Secret: s2s-dev-secret
  Clients:
    beaver-backend:
      ClientID: beaver-backend
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-open:
      ClientID: beaver-open
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-social:
      ClientID: beaver-social
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-call:
      ClientID: beaver-call
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true

