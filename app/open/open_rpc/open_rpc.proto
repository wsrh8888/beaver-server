syntax = "proto3"; //指定proto版本
package open_rpc;

option go_package = "./open_rpc";

// ==================== OAuth ====================

message ExchangeTokenReq {
  string oauth_id = 1;
  string code = 2;
}

message ExchangeTokenRes {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
  string user_id = 5;
}

message GetUserInfoReq {
  string access_token = 1;
}

message GetUserInfoRes {
  string user_id = 1;
  string nick_name = 2;
  string avatar = 3;
  string phone = 4;
  string email = 5;
}

message ValidateTokenReq {
  string access_token = 1;
}

message ValidateTokenRes {
  bool valid = 1;
  string user_id = 2;
  string oauth_id = 3;
}

message RefreshTokenReq {
  string oauth_id = 1;
  string refresh_token = 2;
}

message RefreshTokenRes {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

// ==================== 群通知机器人 Bot ====================

message CreateBotReq {
  string bot_id = 1;
  string owner_id = 2;
  string visibility = 3; // private|partial|public，默认 private
}

message CreateBotRes {
  uint32 id = 1;
  string bot_id = 2;
  string token = 3;
  string webhook_url = 4;
  string signature_secret = 5; // 仅创建时返回明文
}

message DeleteBotReq {
  string bot_id = 1;
}

message DeleteBotRes {}

message ResetBotSecretReq {
  string bot_id = 1;
}

message ResetBotSecretRes {
  string signature_secret = 1;
}

message GetBotInfoReq {
  string bot_id = 1;
}

message BotSecurity {
  bool keywords_enabled = 1;
  repeated string keywords = 2;
  bool ip_whitelist_enabled = 3;
  repeated string ip_whitelist = 4;
}

message GetBotInfoRes {
  uint32 id = 1;
  string bot_id = 2;
  string owner_id = 3;
  string visibility = 4;
  int32 signature_enabled = 5;
  BotSecurity security = 6;
}

message UpdateBotReq {
  string bot_id = 1;
  string visibility = 2;
  int32 signature_enabled = 3; // -1 表示不改；0/1 设置
  BotSecurity security = 4;
}

message UpdateBotRes {}

// ==================== 数字伙伴 Digital ====================

message GetDigitalByUserIDReq {
  string digital_user_id = 1;
}

message GetDigitalByUserIDRes {
  bool found = 1;
  string app_key = 2;
  string digital_user_id = 3;
  string runtime = 4; // builtin|external|workflow
}

// ==================== 数字伙伴编排配置（agent 运行时来取）====================

message GetDigitalConfigReq {
  string digital_id = 1;
}

message GetDigitalConfigRes {
  string digital_id = 1;
  string runtime = 2;               // builtin|external|workflow
  string builtin_config = 3;        // BuiltinConfig JSON（Runtime=builtin 时非空）
  string external_config = 4;       // ExternalConfig JSON（Runtime=external 时非空）
  string workflow_config = 5;       // WorkflowConfig JSON（Runtime=workflow 时非空）
  string app_id = 6;                // 引用 agent_apps.app_id（builtin 模式，platform 取 AI 应用配置）
}

// ==================== OAuth 应用（门户/管理）====================

message OpenOAuthItem {
  string oauth_id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  string owner_user_id = 5;
  int32 status = 6;
  int64 created_at = 7;
}

message ListOpenOAuthReq {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string owner_user_id = 4;
  int32 status = 5;
  string oauth_id = 6;
}

message ListOpenOAuthRes {
  int64 total = 1;
  repeated OpenOAuthItem list = 2;
}

message UpdateOpenOAuthReq {
  repeated string oauth_ids = 1;
  int32 status = 2;
  string operator_id = 3;
}

message UpdateOpenOAuthRes {
  int64 affected_count = 1;
}

// ==================== 数字伙伴管理（后台）====================

message DigitalItem {
  string digital_id = 1;
  string name = 2;
  string description = 3;
  string avatar = 4;
  string owner_id = 5;
  string runtime = 6;
  string visibility = 7;
  int32 status = 8;
  string source = 9; // system|open
  string app_id = 10;
  int64 created_at = 11;
  string system_prompt = 12;
  string llm_model_id = 13;
  string tools = 14;
  string mcp_server_ids = 15;
}

message ListDigitalsReq {
  string source = 1; // system|open，空表示全部
  int32 status = 2;  // -1全部 0禁用 1启用
  int32 page = 3;
  int32 page_size = 4;
}

message ListDigitalsRes {
  int64 total = 1;
  repeated DigitalItem list = 2;
}

message CreateDigitalReq {
  string name = 1;
  string description = 2;
  string avatar = 3;
  string runtime = 4;    // builtin|external
  string visibility = 5; // private|partial|public
  string app_id = 6;     // builtin 时引用 agent_apps.app_id
  string source = 7;     // system|open
  string owner_id = 8;
  string system_prompt = 9;
  string llm_model_id = 10;
  string tools = 11; // JSON [toolId]
  string mcp_server_ids = 12; // JSON [mcpServerId]
}

message CreateDigitalRes {
  string digital_id = 1;
  string app_key = 2;
  string app_secret = 3; // 仅 external 创建时返回一次
}

message UpdateDigitalReq {
  string digital_id = 1;
  string name = 2;
  string visibility = 3;
  int32 status = 4; // 0禁用 1启用
  string app_id = 5;
  string system_prompt = 6;
  string llm_model_id = 7;
  string tools = 8;
  string mcp_server_ids = 9;
}

message UpdateDigitalRes {}

service open {
  rpc ExchangeToken(ExchangeTokenReq) returns (ExchangeTokenRes);
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoRes);
  rpc ValidateToken(ValidateTokenReq) returns (ValidateTokenRes);
  rpc RefreshToken(RefreshTokenReq) returns (RefreshTokenRes);
  rpc CreateBot(CreateBotReq) returns (CreateBotRes);
  rpc DeleteBot(DeleteBotReq) returns (DeleteBotRes);
  rpc ResetBotSecret(ResetBotSecretReq) returns (ResetBotSecretRes);
  rpc GetBotInfo(GetBotInfoReq) returns (GetBotInfoRes);
  rpc UpdateBot(UpdateBotReq) returns (UpdateBotRes);
  rpc GetDigitalByUserID(GetDigitalByUserIDReq) returns (GetDigitalByUserIDRes);
  rpc GetDigitalConfig(GetDigitalConfigReq) returns (GetDigitalConfigRes);
  rpc ListOpenOAuth(ListOpenOAuthReq) returns (ListOpenOAuthRes);
  rpc UpdateOpenOAuth(UpdateOpenOAuthReq) returns (UpdateOpenOAuthRes);
  rpc ListDigitals(ListDigitalsReq) returns (ListDigitalsRes);
  rpc CreateDigital(CreateDigitalReq) returns (CreateDigitalRes);
  rpc UpdateDigital(UpdateDigitalReq) returns (UpdateDigitalRes);
}

