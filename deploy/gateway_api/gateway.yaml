Name: gateway
Addr: 0.0.0.0:20800
etcd: 127.0.0.1:2379
# 服务映射：路径第 3 段 service → 完整 etcd 服务名（未命中默认 {service}_api）。
ServiceAlias:
  auth: account_api
  user: account_api
  chat: message_api
  friend: relation_api
  group: relation_api
  file: asset_api
  emoji: asset_api
  circle: social_api
  moment: social_api
  developer: open_api
  org: platform_api
  workbench: platform_api
  ai: agent_api
  call: call_api
  doc: doc_api
  backend: backend_admin
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
Limit:
  Enable: true
  Rate: 100    # 每秒请求数
  Burst: 200   # 峰值容忍
# 网关不验签、不注入身份头；Token / Authorization 原样转发。
# 鉴权全部由下游业务服务在 .api 中声明式声明并由其中间件执行。
