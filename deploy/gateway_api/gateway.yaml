Name: gateway
Addr: 0.0.0.0:20800
etcd: 127.0.0.1:2379
# 服务合并映射：URL 前缀 → 合并后的服务名（etcd 查 {值}_api）。
ServiceAlias:
  chat: message
  friend: relation
  group: relation
  file: asset
  emoji: asset
  user: account
  auth: account
  circle: social
  moment: social
  developer: open
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
Limit:
  Enable: true
  Rate: 100    # 每秒请求数
  Burst: 200   # 峰值容忍
# 网关不验签、不注入身份头；Token / Authorization 原样转发。
# 鉴权全部由下游业务服务在 .api 中声明式声明并由其中间件执行。
