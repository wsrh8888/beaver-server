Name: message_rpc
ListenOn: 0.0.0.0:30300
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: messagerpc.rpc
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_message?charset=utf8mb4&parseTime=True&loc=Local
Log:
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  Stat: false
RedisConf:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
DatasyncRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: datasyncrpc.rpc
UserRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
FriendRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
GroupRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
# S2S 出站：跨仓对端（beaver-open / beaver-ai 独立仓），跨团队必须走 API，禁 etcd gRPC。
Open:
  BaseURL: http://127.0.0.1:21900
  ClientID: beaver-server
  ClientSecret: s2s-dev-secret
Ai:
  BaseURL: http://127.0.0.1:22200
  ClientID: beaver-server
  ClientSecret: s2s-dev-secret
# Agent beaver-agent(py) S2S 出站：跨仓禁 gRPC，走 agent_api 网关。
Agent:
  BaseURL: http://127.0.0.1:22300
  InternalToken: ""
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
RocketMQ:
  Addr: 127.0.0.1:9876
Push:
  Enabled: false
  FCM:
    Enabled: false
    ProjectID: ""
    CredentialsFile: ""
  APNs:
    Enabled: false
    KeyFile: ""
    KeyID: ""
    TeamID: ""
    BundleID: ""
    Production: false