# 出站 S2S 端点注册表：key 是对端团队/服务名，值是对方网关地址与鉴权方式。
# 跨团队一律走对方网关的 /internal/<Module>.<Method>，禁止 etcd gRPC 直连、禁止引用对方代码。
RemoteProxy:
  Open:
    BaseURL: http://127.0.0.1:21900
    Auth: client_credentials
    ClientID: beaver-server
    ClientSecret: s2s-dev-secret
Name: relation
Host: 0.0.0.0
Port: 20200
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3306)/beaver_relation?charset=utf8mb4&parseTime=True&loc=Local
Redis:
  Addr: 127.0.0.1:6379
  Password: '123456'
  DB: 0
Log:
  Mode: file
  Path: logs/relation_api
  Encoding: json
  TimeFormat: 2006-01-02T15:04:05
  KeepDays: 7
  Stat: false
# go-zero 自带：在独立端口暴露 /metrics（业务口 20200 + 7000）
Prometheus:
  Host: 0.0.0.0
  Port: 27200
  Path: /metrics
Etcd: 127.0.0.1:2379
Domain: http://192.168.3.4:20800
UserRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: accountrpc.rpc
# relation_rpc：friend + group 同进程（etcd relationrpc.rpc）
RelationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: relationrpc.rpc
ChatRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: messagerpc.rpc
NotificationRpc:
  NonBlock: true
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: notificationrpc.rpc
RocketMQ:
  Addr: 127.0.0.1:9876

S2S:
  Secret: s2s-dev-secret
  Clients:
    beaver-backend:
      ClientID: beaver-backend
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-open:
      ClientID: beaver-open
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-social:
      ClientID: beaver-social
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true
    beaver-call:
      ClientID: beaver-call
      ClientSecret: s2s-dev-secret
      Scopes: []
      Enabled: true

