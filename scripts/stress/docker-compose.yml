# 压测可观测性栈：InfluxDB（k6 时序输出）+ Grafana（仪表盘）
#
# 标准做法：k6 --out influxdb=... 写时序，Grafana 看延迟/QPS 随并发变化曲线。
# k6 的 JSON 输出只是单次快照，看趋势必须用时序库。
#
# 数据存放：bind mount 到 ./data/，就地存放、可控、可 gitignore，不进 Docker 命名卷。
#
# 启动：
#   cd scripts/stress
#   docker compose up -d
# 压测（结果实时写 InfluxDB）：
#   k6 run --out influxdb=http://localhost:8086/k6 single/auth/login.js
# 看板：浏览器 http://localhost:3000 (admin/admin)，Import 官方 k6 仪表盘 ID 2587
# 停止（保留数据）：
#   docker compose down
# 停止并清数据：
#   docker compose down
#   Remove-Item -Recurse -Force data

services:
  influxdb:
    image: docker.m.daocloud.io/influxdb:1.8
    container_name: stress-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - ./data/influxdb:/var/lib/influxdb

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:latest
    container_name: stress-grafana
    user: "0:0"  # Windows bind mount 权限：Grafana 默认 grafana 用户写不进，改 root 跑
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - influxdb
